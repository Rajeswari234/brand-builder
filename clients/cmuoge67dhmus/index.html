      <title>Brand Delivery Hub</title>
      <meta name="description" content="Final brand delivery dashboard: brand, logo, color, type, components, templates, downloads and handoff in one place.">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
      <link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
      <style>
        /* =====================================================================
   STATIC FALLBACK TOKENS — overwritten at runtime from the BRAND config
   (see <script> below). Kept here so the first paint is never unstyled.
   ===================================================================== */
        :root {
          --bg-canvas: #f6f7f9;
          --bg-surface: #ffffff;
          --bg-raised: #ffffff;
          --bg-muted: #eef0f3;
          --bg-brand: #2b5f8a;
          --bg-brand-subtle: #e8eff5;
          --bg-inverse: #14181d;
          --text-primary: #14181d;
          --text-secondary: #4a5361;
          --text-tertiary: #737d8c;
          --text-on-brand: #ffffff;
          --text-brand: #23506f;
          --text-inverse: #f6f7f9;
          --border-subtle: #e3e6ea;
          --border-default: #cfd4da;
          --border-strong: #9aa3ae;
          --border-focus: #2b5f8a;
          --accent: #e8a33d;
          --success: #2f8f5b;
          --warning: #c9861a;
          --danger: #c8423b;
          --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
          --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
          --radius: 10px;
          --shadow: 0 1px 2px rgba(20, 24, 29, 0.06), 0 4px 14px rgba(20, 24, 29, 0.06);
        }
        @media (prefers-color-scheme: dark) {
          :root:not([data-theme="light"]) {
            color-scheme: dark;
            --bg-canvas: #0e1216;
            --bg-surface: #161b21;
            --bg-raised: #1d232b;
            --bg-muted: #222932;
            --bg-brand: #5d8fb8;
            --bg-brand-subtle: #1a2a38;
            --bg-inverse: #f6f7f9;
            --text-primary: #eef1f4;
            --text-secondary: #b3bcc7;
            --text-tertiary: #8791a0;
            --text-on-brand: #0e1216;
            --text-brand: #8fb6d6;
            --text-inverse: #14181d;
            --border-subtle: #252c35;
            --border-default: #333c47;
            --border-strong: #566170;
            --border-focus: #8fb6d6;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
          }
        }
        :root[data-theme="dark"] {
          color-scheme: dark;
          --bg-canvas: #0e1216;
          --bg-surface: #161b21;
          --bg-raised: #1d232b;
          --bg-muted: #222932;
          --bg-brand: #5d8fb8;
          --bg-brand-subtle: #1a2a38;
          --bg-inverse: #f6f7f9;
          --text-primary: #eef1f4;
          --text-secondary: #b3bcc7;
          --text-tertiary: #8791a0;
          --text-on-brand: #0e1216;
          --text-brand: #8fb6d6;
          --text-inverse: #14181d;
          --border-subtle: #252c35;
          --border-default: #333c47;
          --border-strong: #566170;
          --border-focus: #8fb6d6;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        * {
          box-sizing: border-box;
        }
        body {
          margin: 0;
          background: var(--bg-canvas);
          color: var(--text-primary);
          font-family: var(--font-body);
          font-size: 15px;
          line-height: 1.55;
          -webkit-font-smoothing: antialiased;
        }
        h1,
        h2,
        h3,
        h4 {
          font-family: var(--font-display);
          margin: 0;
          text-wrap: balance;
          letter-spacing: -0.015em;
          line-height: 1.15;
        }
        p {
          margin: 0;
        }
        a {
          color: var(--text-brand);
        }
        code,
        .mono {
          font-family: var(--font-mono);
          font-size: 0.84em;
        }
        button {
          font: inherit;
          color: inherit;
        }
        :focus-visible {
          outline: 2px solid var(--border-focus);
          outline-offset: 2px;
          border-radius: 4px;
        }

        /* ---------- Shell ---------- */
        .shell {
          display: grid;
          grid-template-columns: 248px minmax(0, 1fr);
          min-height: 100%;
        }
        .side {
          position: sticky;
          top: env(safe-area-inset-top, 0px);
          height: 100vh;
          overflow: auto;
          border-right: 1px solid var(--border-subtle);
          background: var(--bg-surface);
          padding: 22px 14px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .side-brand {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 8px;
        }
        .side-brand .mark {
          width: 34px;
          height: 34px;
          flex: none;
        }
        .side-brand b {
          font-family: var(--font-display);
          font-size: 16px;
          display: block;
          line-height: 1.1;
        }
        .side-brand small {
          color: var(--text-tertiary);
          font-size: 12px;
        }
        .nav {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .nav a {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 8px 10px;
          border-radius: 8px;
          color: var(--text-secondary);
          text-decoration: none;
          font-weight: 500;
          font-size: 14px;
        }
        .nav a:hover {
          background: var(--bg-muted);
          color: var(--text-primary);
        }
        .nav a.on {
          background: var(--bg-brand-subtle);
          color: var(--text-brand);
        }
        .nav a span {
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--text-tertiary);
        }
        .side-foot {
          margin-top: auto;
          padding: 12px 10px;
          border-top: 1px solid var(--border-subtle);
          font-size: 12px;
          color: var(--text-tertiary);
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .theme-toggle {
          display: flex;
          gap: 4px;
          background: var(--bg-muted);
          border-radius: 8px;
          padding: 3px;
        }
        .theme-toggle button {
          flex: 1;
          border: 0;
          background: transparent;
          padding: 5px 0;
          border-radius: 6px;
          font-size: 12px;
          cursor: pointer;
          color: var(--text-secondary);
        }
        .theme-toggle button[aria-pressed="true"] {
          background: var(--bg-surface);
          color: var(--text-primary);
          box-shadow: var(--shadow);
        }

        main {
          padding-inline: clamp(16px, 4vw, 56px);
          padding-block: 32px 96px;
          max-width: 1180px;
          width: 100%;
        }
        section {
          padding-block: 44px;
          border-bottom: 1px solid var(--border-subtle);
          scroll-margin-top: 16px;
        }
        section:last-child {
          border-bottom: 0;
        }
        .sec-head {
          display: flex;
          flex-wrap: wrap;
          align-items: end;
          justify-content: space-between;
          gap: 12px;
          margin-bottom: 26px;
        }
        .eyebrow {
          font-size: 11.5px;
          font-weight: 600;
          letter-spacing: 0.09em;
          text-transform: uppercase;
          color: var(--text-tertiary);
          margin-bottom: 6px;
        }
        .sec-head h2 {
          font-size: clamp(26px, 3vw, 34px);
        }
        .sec-head p {
          color: var(--text-secondary);
          max-width: 62ch;
          margin-top: 6px;
        }
        h3 {
          font-size: 18px;
          margin-bottom: 12px;
        }
        .sub {
          margin-top: 34px;
        }

        /* ---------- Primitives ---------- */
        .card {
          background: var(--bg-surface);
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
          padding: 20px;
        }
        .grid {
          display: grid;
          gap: 16px;
        }
        .g2 {
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        }
        .g3 {
          grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
        }
        .g4 {
          grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr));
        }
        /* Card sizes. Wide cards span two columns only where two fit, so phones never scroll sideways. */
        .grid > [data-span="full"] {
          grid-column: 1 / -1;
        }
        .grid:has(> [data-span="2"]) {
          container-type: inline-size;
        }
        @container (min-width: 420px) {
          .g4 > [data-span="2"] {
            grid-column: span 2;
          }
        }
        @container (min-width: 520px) {
          .g3 > [data-span="2"] {
            grid-column: span 2;
          }
        }
        @container (min-width: 680px) {
          .g2 > [data-span="2"] {
            grid-column: span 2;
          }
        }
        .logo-tile[data-span="2"] .logo-stage {
          aspect-ratio: 8/3;
        }
        .logo-tile[data-span="full"] .logo-stage {
          aspect-ratio: auto;
          min-height: 220px;
        }
        .logo-tile[data-span] .logo-stage img {
          max-height: 160px;
        }
        .pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 12px;
          font-weight: 600;
          padding: 3px 9px;
          border-radius: 999px;
          background: var(--bg-muted);
          color: var(--text-secondary);
          white-space: nowrap;
        }
        .pill.ok {
          background: color-mix(in srgb, var(--success) 16%, transparent);
          color: var(--success);
        }
        .pill.warn {
          background: color-mix(in srgb, var(--warning) 18%, transparent);
          color: var(--warning);
        }
        .pill.bad {
          background: color-mix(in srgb, var(--danger) 15%, transparent);
          color: var(--danger);
        }
        .pill.brand {
          background: var(--bg-brand-subtle);
          color: var(--text-brand);
        }
        .copy {
          cursor: pointer;
          border: 1px solid var(--border-default);
          background: var(--bg-surface);
          border-radius: 6px;
          padding: 3px 8px;
          font-size: 12px;
          color: var(--text-secondary);
        }
        .copy:hover {
          border-color: var(--border-strong);
          color: var(--text-primary);
        }
        .btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          border-radius: var(--radius);
          font-weight: 600;
          cursor: pointer;
          border: 1px solid transparent;
          text-decoration: none;
          transition:
            background 0.15s,
            border-color 0.15s,
            transform 0.1s;
        }
        .btn:active {
          transform: translateY(1px);
        }
        .btn[data-size="sm"] {
          font-size: 13px;
          padding: 6px 12px;
        }
        .btn[data-size="md"] {
          font-size: 14px;
          padding: 9px 16px;
        }
        .btn[data-size="lg"] {
          font-size: 16px;
          padding: 12px 22px;
        }
        .btn[data-variant="primary"] {
          background: var(--bg-brand);
          color: var(--text-on-brand);
        }
        .btn[data-variant="primary"]:hover {
          filter: brightness(1.08);
        }
        .btn[data-variant="secondary"] {
          background: var(--bg-surface);
          border-color: var(--border-default);
          color: var(--text-primary);
        }
        .btn[data-variant="secondary"]:hover {
          border-color: var(--border-strong);
        }
        .btn[data-variant="ghost"] {
          background: transparent;
          color: var(--text-brand);
        }
        .btn[data-variant="ghost"]:hover {
          background: var(--bg-brand-subtle);
        }
        .btn[data-variant="destructive"] {
          background: var(--danger);
          color: #fff;
        }
        .btn:disabled,
        .btn[aria-disabled="true"] {
          opacity: 0.45;
          cursor: not-allowed;
        }
        .toast {
          position: fixed;
          left: 50%;
          bottom: calc(24px + env(safe-area-inset-bottom, 0px));
          transform: translate(-50%, 20px);
          background: var(--bg-inverse);
          color: var(--text-inverse);
          padding: 9px 16px;
          border-radius: 8px;
          font-size: 13px;
          opacity: 0;
          pointer-events: none;
          transition: 0.2s;
        }
        .toast.show {
          opacity: 1;
          transform: translate(-50%, 0);
        }

        /* ---------- Welcome ---------- */
        .hero {
          display: grid;
          grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
          gap: 28px;
          align-items: stretch;
        }
        .hero-main {
          background: var(--bg-brand);
          color: var(--text-on-brand);
          border-radius: calc(var(--radius) * 1.6);
          padding: clamp(24px, 4vw, 44px);
          display: flex;
          flex-direction: column;
          gap: 18px;
          position: relative;
          overflow: hidden;
        }
        .hero-main .eyebrow {
          color: inherit;
          opacity: 0.75;
        }
        .hero-main h1 {
          font-size: clamp(34px, 5vw, 58px);
          letter-spacing: -0.03em;
        }
        .hero-main p {
          font-size: 17px;
          opacity: 0.9;
          max-width: 44ch;
        }
        .hero-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: auto;
        }
        .hero-meta .pill {
          background: color-mix(in srgb, currentColor 14%, transparent);
          color: inherit;
        }
        .hero-ring {
          position: absolute;
          right: -70px;
          top: -70px;
          width: 200px;
          height: 200px;
          border-radius: 50%;
          border: 30px solid var(--accent);
          opacity: 0.85;
        }
        .hero-main > :not(.hero-ring) {
          position: relative;
          z-index: 1;
        }
        .facts {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .fact {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px;
          padding: 14px 16px;
          background: var(--bg-surface);
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
        }
        .fact small {
          color: var(--text-tertiary);
          font-size: 12px;
          display: block;
        }
        .fact b {
          font-size: 15px;
        }
        .start {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
          gap: 12px;
          margin-top: 22px;
        }
        .start a {
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 16px;
          border-radius: var(--radius);
          border: 1px solid var(--border-subtle);
          background: var(--bg-surface);
          text-decoration: none;
          color: var(--text-primary);
        }
        .start a:hover {
          border-color: var(--border-strong);
        }
        .start a small {
          color: var(--text-secondary);
          font-size: 13px;
        }
        .start a b {
          font-size: 15px;
        }

        /* ---------- Brand ---------- */
        .idea {
          font-family: var(--font-display);
          font-size: clamp(22px, 2.6vw, 30px);
          line-height: 1.25;
          max-width: 30ch;
          letter-spacing: -0.02em;
        }
        .pillar h4 {
          font-size: 17px;
          margin-bottom: 6px;
        }
        .pillar p {
          color: var(--text-secondary);
          font-size: 14px;
        }
        .saylike {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          margin-top: 14px;
          font-size: 13px;
        }
        .saylike div {
          padding: 8px 10px;
          border-radius: 8px;
          background: var(--bg-muted);
        }
        .saylike small {
          display: block;
          font-size: 10.5px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin-bottom: 2px;
        }
        .saylike .yes small {
          color: var(--success);
        }
        .saylike .no small {
          color: var(--danger);
        }
        .slider {
          display: grid;
          grid-template-columns: 110px 1fr 110px;
          gap: 12px;
          align-items: center;
          font-size: 13px;
          color: var(--text-secondary);
        }
        .slider div:last-child {
          text-align: right;
        }
        .track {
          height: 6px;
          background: var(--bg-muted);
          border-radius: 6px;
          position: relative;
        }
        .track i {
          position: absolute;
          top: 50%;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: var(--bg-brand);
          transform: translate(-50%, -50%);
          box-shadow: 0 0 0 3px var(--bg-surface);
        }
        .scale-card {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .scale-card > p {
          color: var(--text-secondary);
          font-size: 14px;
          margin-top: -6px;
        }
        .scale-rows {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .slider .track i b {
          position: absolute;
          top: -24px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 11px;
          font-weight: 600;
          color: var(--text-brand);
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }
        .slider.has-num {
          padding-top: 14px;
        }
        .row-note {
          grid-column: 1/-1;
          font-size: 12.5px;
          color: var(--text-tertiary);
          margin-top: -6px;
        }
        .slider div.row-note:last-child {
          text-align: left;
        }
        .meter-row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 6px 12px;
          align-items: baseline;
          font-size: 14px;
        }
        .meter-row .bar {
          grid-column: 1/-1;
          height: 8px;
          background: var(--bg-muted);
          border-radius: 8px;
          overflow: hidden;
        }
        .meter-row .bar i {
          display: block;
          height: 100%;
          background: var(--bg-brand);
          border-radius: 8px;
        }
        .meter-row b {
          font-variant-numeric: tabular-nums;
        }
        .value-row {
          display: grid;
          grid-template-columns: minmax(0, 40%) minmax(0, 1fr);
          gap: 4px 16px;
          padding-bottom: 12px;
          border-bottom: 1px solid var(--border-subtle);
          font-size: 14px;
        }
        .value-row:last-child {
          border-bottom: 0;
          padding-bottom: 0;
        }
        .value-row span {
          color: var(--text-secondary);
        }
        .value-row b {
          overflow-wrap: anywhere;
        }
        .boiler {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .boiler .head {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .boiler p {
          color: var(--text-secondary);
          font-size: 14px;
        }

        /* ---------- Logo ---------- */
        .logo-tile {
          border-radius: var(--radius);
          border: 1px solid var(--border-subtle);
          overflow: hidden;
          background: var(--bg-surface);
          display: flex;
          flex-direction: column;
        }
        .logo-stage {
          aspect-ratio: 4/3;
          display: grid;
          place-items: center;
          padding: 28px;
          max-width: 100%;
        }
        .logo-stage svg,
        .logo-stage img {
          max-width: 100%;
          max-height: 100%;
        }
        .logo-stage img {
          max-height: 120px;
          object-fit: contain;
        }
        .clearspace img {
          display: block;
          max-width: 240px;
          max-height: 90px;
        }
        .side-brand .mark img {
          width: 34px;
          height: 34px;
          object-fit: contain;
          display: block;
        }
        .logo-meta {
          padding: 12px 14px;
          border-top: 1px solid var(--border-subtle);
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          font-size: 13px;
        }
        .logo-meta b {
          display: block;
        }
        .logo-meta small {
          color: var(--text-tertiary);
        }
        .misuse .logo-stage {
          position: relative;
        }
        .misuse .logo-stage::after {
          content: "";
          position: absolute;
          inset: 14px;
          background: linear-gradient(
            to top right,
            transparent calc(50% - 1px),
            var(--danger) calc(50% - 1px),
            var(--danger) calc(50% + 1px),
            transparent calc(50% + 1px)
          );
          opacity: 0.7;
          pointer-events: none;
        }
        .clearspace {
          position: relative;
          display: inline-block;
          padding: var(--cs);
          outline: 1px dashed var(--danger);
          outline-offset: 0;
        }
        .clearspace::before {
          content: "";
          position: absolute;
          inset: var(--cs);
          outline: 1px solid var(--border-default);
        }

        /* ---------- Color ---------- */
        .ramp {
          display: grid;
          grid-template-columns: repeat(11, minmax(0, 1fr));
          border-radius: var(--radius);
          overflow: hidden;
          border: 1px solid var(--border-subtle);
        }
        .ramp button {
          border: 0;
          padding: 0;
          cursor: pointer;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          min-height: 88px;
          padding: 8px 6px;
          text-align: left;
          font-size: 11px;
          line-height: 1.3;
        }
        .ramp button b {
          font-size: 12px;
        }
        .ramp button.base {
          box-shadow: inset 0 -4px 0 currentColor;
        }
        .ramp-head {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          margin-bottom: 8px;
        }
        .ramp-head b {
          font-family: var(--font-display);
          font-size: 16px;
        }
        .ramp-wrap {
          overflow-x: auto;
        }
        .ramp-wrap .ramp {
          min-width: 620px;
        }
        .proportion {
          display: flex;
          height: 56px;
          border-radius: var(--radius);
          overflow: hidden;
          border: 1px solid var(--border-subtle);
        }
        .proportion div {
          display: flex;
          align-items: flex-end;
          padding: 8px 10px;
          font-size: 12px;
          font-weight: 600;
        }
        table {
          border-collapse: collapse;
          width: 100%;
          font-size: 13.5px;
        }
        th,
        td {
          text-align: left;
          padding: 10px 12px;
          border-bottom: 1px solid var(--border-subtle);
          vertical-align: middle;
        }
        th {
          font-size: 11.5px;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--text-tertiary);
          font-weight: 600;
        }
        .tbl {
          overflow-x: auto;
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
          background: var(--bg-surface);
        }
        .tbl tr:last-child td {
          border-bottom: 0;
        }
        .sw {
          display: inline-block;
          width: 18px;
          height: 18px;
          border-radius: 5px;
          border: 1px solid var(--border-subtle);
          vertical-align: middle;
          margin-right: 8px;
        }
        .num {
          font-variant-numeric: tabular-nums;
        }
        .pair {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 40px;
          height: 28px;
          border-radius: 6px;
          font-weight: 600;
          font-size: 13px;
          border: 1px solid var(--border-subtle);
        }

        /* ---------- Type ---------- */
        .type-row {
          display: grid;
          grid-template-columns: 170px minmax(0, 1fr);
          gap: 20px;
          align-items: baseline;
          padding-block: 14px;
          border-bottom: 1px solid var(--border-subtle);
        }
        .type-row:last-child {
          border-bottom: 0;
        }
        .type-row .spec {
          font-size: 12px;
          color: var(--text-tertiary);
          line-height: 1.5;
        }
        .type-row .spec code {
          color: var(--text-brand);
          font-size: 12px;
        }
        .type-row .sample {
          overflow-wrap: anywhere;
        }
        .family {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .family .big {
          font-size: 64px;
          line-height: 1;
        }
        .family small {
          color: var(--text-tertiary);
        }

        /* ---------- Spacing ---------- */
        .space-row {
          display: grid;
          grid-template-columns: 80px 48px minmax(0, 1fr);
          gap: 12px;
          align-items: center;
          font-size: 13px;
          padding-block: 4px;
        }
        .space-row i {
          display: block;
          height: 14px;
          background: var(--bg-brand);
          border-radius: 3px;
          max-width: 100%;
        }
        .radius-demo {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
        }
        .radius-demo div {
          width: 84px;
          height: 84px;
          background: var(--bg-brand-subtle);
          border: 2px solid var(--bg-brand);
          display: grid;
          place-items: end center;
          padding-bottom: 6px;
          font-size: 11px;
          color: var(--text-brand);
          font-weight: 600;
        }
        .grid-demo {
          display: grid;
          grid-template-columns: repeat(12, 1fr);
          gap: 8px;
          height: 80px;
        }
        .grid-demo i {
          background: color-mix(in srgb, var(--danger) 14%, transparent);
          border-inline: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        }

        /* ---------- Components ---------- */
        .comp {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .comp-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }
        .comp-stage {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          align-items: center;
          padding: 22px;
          background: var(--bg-canvas);
          border-radius: 8px;
          border: 1px dashed var(--border-default);
        }
        .comp pre {
          margin: 0;
          background: var(--bg-muted);
          border-radius: 8px;
          padding: 10px 12px;
          overflow-x: auto;
          font-size: 12px;
        }
        .field {
          display: flex;
          flex-direction: column;
          gap: 6px;
          width: 100%;
          max-width: 280px;
        }
        .field label {
          font-size: 13px;
          font-weight: 500;
        }
        .field input {
          font: inherit;
          font-size: 14px;
          padding: 9px 12px;
          border-radius: var(--radius);
          border: 1px solid var(--border-default);
          background: var(--bg-surface);
          color: var(--text-primary);
        }
        .field input:focus {
          outline: none;
          border-color: var(--border-focus);
          box-shadow: 0 0 0 3px var(--bg-brand-subtle);
        }
        .field.err input {
          border-color: var(--danger);
        }
        .field small {
          font-size: 12px;
          color: var(--text-tertiary);
        }
        .field.err small {
          color: var(--danger);
        }
        .alert {
          display: flex;
          gap: 10px;
          padding: 12px 14px;
          border-radius: var(--radius);
          border: 1px solid;
          font-size: 14px;
          width: 100%;
        }
        .alert b {
          display: block;
        }
        .demo-card {
          background: var(--bg-surface);
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
          overflow: hidden;
          max-width: 260px;
          box-shadow: var(--shadow);
        }
        .demo-card .img {
          height: 110px;
          background: linear-gradient(
            135deg,
            var(--bg-brand),
            color-mix(in srgb, var(--bg-brand) 60%, var(--accent))
          );
        }
        .demo-card .body {
          padding: 14px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .demo-card p {
          font-size: 13px;
          color: var(--text-secondary);
        }
        .avatar {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          display: grid;
          place-items: center;
          font-weight: 600;
          background: var(--bg-brand-subtle);
          color: var(--text-brand);
          font-size: 14px;
        }

        /* ---------- Templates ---------- */
        .tpl {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .tpl-art {
          aspect-ratio: 4/5;
          border-radius: var(--radius);
          overflow: hidden;
          position: relative;
          display: flex;
          flex-direction: column;
          padding: 8%;
          border: 1px solid var(--border-subtle);
          max-width: 100%;
          container-type: inline-size;
        }
        .tpl-art .logo-sm {
          height: 7cqw;
          min-height: 12px;
        }
        .tpl-art .logo-sm img,
        .tpl-art .logo-sm svg {
          height: 100%;
          width: auto;
          display: block;
        }
        .tpl-art h4 {
          font-size: 11cqw;
          line-height: 1.02;
          letter-spacing: -0.03em;
        }
        .tpl-art .big {
          font-family: var(--font-display);
          font-size: 30cqw;
          line-height: 0.9;
          letter-spacing: -0.05em;
          font-weight: 700;
        }
        .tpl-art p {
          font-size: 4.6cqw;
          opacity: 0.85;
        }
        .tpl-foot {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }
        .tpl-foot b {
          font-size: 14px;
          display: block;
        }
        .tpl-foot small {
          color: var(--text-tertiary);
          font-size: 12px;
        }
        .tpl-links {
          display: flex;
          gap: 6px;
        }
        .filter {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
        }
        .filter button {
          border: 1px solid var(--border-default);
          background: var(--bg-surface);
          border-radius: 999px;
          padding: 5px 12px;
          font-size: 13px;
          cursor: pointer;
          color: var(--text-secondary);
        }
        .filter button[aria-pressed="true"] {
          background: var(--bg-inverse);
          color: var(--text-inverse);
          border-color: var(--bg-inverse);
        }

        /* ---------- Downloads / Handoff ---------- */
        .dl {
          display: flex;
          flex-direction: column;
          gap: 10px;
          justify-content: flex-start;
        }
        .dl > .btn:last-child {
          margin-top: auto;
          align-self: flex-start;
        }
        .dl .top {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 8px;
        }
        .dl code {
          color: var(--text-tertiary);
          font-size: 12px;
        }
        .dl p {
          color: var(--text-secondary);
          font-size: 13.5px;
        }
        .fmt {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
        }
        .fmt span {
          font-family: var(--font-mono);
          font-size: 10.5px;
          padding: 2px 6px;
          border-radius: 4px;
          background: var(--bg-muted);
          color: var(--text-secondary);
        }
        .support {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .meter {
          height: 8px;
          background: var(--bg-muted);
          border-radius: 8px;
          overflow: hidden;
        }
        .meter i {
          display: block;
          height: 100%;
          background: var(--bg-brand);
        }
        .log {
          display: flex;
          flex-direction: column;
        }
        .log div {
          display: grid;
          grid-template-columns: 70px 100px 1fr;
          gap: 12px;
          padding: 10px 0;
          border-bottom: 1px solid var(--border-subtle);
          font-size: 14px;
        }
        .log div:last-child {
          border-bottom: 0;
        }
        .log span {
          color: var(--text-tertiary);
        }
        .contact {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .contact small {
          color: var(--text-tertiary);
          display: block;
          font-size: 12.5px;
        }
        .link-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 10px;
          padding: 12px 0;
          border-bottom: 1px solid var(--border-subtle);
        }
        .link-row:last-child {
          border-bottom: 0;
        }
        .link-row small {
          color: var(--text-tertiary);
          display: block;
          font-size: 12.5px;
        }

        /* ---------- Links, downloads, 3D ---------- */
        a.fact {
          color: inherit;
          text-decoration: none;
          transition: border-color 0.15s;
        }
        a.fact:hover {
          border-color: var(--border-strong);
        }
        a.fact .go {
          color: var(--text-brand);
          font-size: 13px;
          font-weight: 600;
          white-space: nowrap;
        }
        .hero.solo {
          grid-template-columns: 1fr;
        }
        .hero-main.on-light .hero-meta .pill {
          background: color-mix(in srgb, currentColor 10%, transparent);
        }
        .fam-actions {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          margin-top: auto;
          padding-top: 6px;
        }
        .family.viewing {
          border-color: var(--border-focus);
          box-shadow: 0 0 0 1px var(--border-focus);
        }
        .type-view-bar {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
          font-size: 13px;
          color: var(--text-secondary);
          margin-bottom: 10px;
        }
        .dl-menu {
          position: relative;
        }
        .dl-menu summary {
          list-style: none;
        }
        .dl-menu summary::-webkit-details-marker {
          display: none;
        }
        .dl-pop {
          position: absolute;
          z-index: 4;
          top: calc(100% + 6px);
          left: 0;
          min-width: 220px;
          background: var(--bg-surface);
          border: 1px solid var(--border-default);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          padding: 6px;
          display: flex;
          flex-direction: column;
        }
        .dl-pop a {
          padding: 7px 9px;
          border-radius: 6px;
          font-size: 13px;
          text-decoration: none;
          color: var(--text-primary);
          overflow-wrap: anywhere;
        }
        .dl-pop a:hover {
          background: var(--bg-muted);
        }
        .dl-row {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }
        .logo-dl {
          display: flex;
          flex-wrap: wrap;
          gap: 4px 10px;
          margin-top: 6px;
          font-size: 12px;
        }
        .logo-dl a {
          color: var(--text-brand);
          font-weight: 600;
          text-decoration: none;
        }
        .logo-dl a:hover {
          text-decoration: underline;
        }
        .dl-files {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .dl-file {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 10px;
          font-size: 13px;
          padding: 6px 0;
          border-top: 1px solid var(--border-subtle);
        }
        .dl-file span {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          color: var(--text-secondary);
        }
        .dl-more summary {
          cursor: pointer;
          font-size: 13px;
          font-weight: 600;
          color: var(--text-brand);
          padding-top: 6px;
        }
        .dl-empty {
          font-size: 13px;
          color: var(--text-tertiary);
        }
        .m3d-folder {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
          flex-wrap: wrap;
        }
        .views {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr));
          gap: 12px;
          margin-top: 16px;
        }
        .view {
          margin: 0;
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
          overflow: hidden;
          background: var(--bg-canvas);
          display: flex;
          flex-direction: column;
        }
        .view img {
          display: block;
          width: 100%;
          aspect-ratio: 1/1;
          object-fit: contain;
          background: repeating-conic-gradient(var(--bg-muted) 0 25%, var(--bg-surface) 0 50%) 0 0/16px 16px;
        }
        .view-ph {
          aspect-ratio: 1/1;
          display: grid;
          place-items: center;
          text-align: center;
          font-size: 13px;
          color: var(--text-tertiary);
          background: var(--bg-muted);
        }
        .view figcaption {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          padding: 10px 12px;
          font-size: 13px;
          font-weight: 600;
          background: var(--bg-surface);
          border-top: 1px solid var(--border-subtle);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 900px) {
          .shell {
            grid-template-columns: minmax(0, 1fr);
          }
          .side {
            min-width: 0;
          }
          .side {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            height: auto;
            z-index: 5;
            flex-direction: row;
            align-items: center;
            padding: 10px 16px;
            border-right: 0;
            border-bottom: 1px solid var(--border-subtle);
            overflow-x: auto;
            gap: 14px;
          }
          .side-brand small,
          .side-foot {
            display: none;
          }
          .nav {
            flex-direction: row;
            gap: 2px;
          }
          .nav a {
            white-space: nowrap;
            padding: 6px 10px;
          }
          .nav a span {
            display: none;
          }
          .hero {
            grid-template-columns: 1fr;
          }
          .type-row {
            grid-template-columns: 1fr;

        const STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
        const hex2rgb = (h) => {
          h = h.replace("#", "");
          if (h.length === 3) h = [...h].map((c) => c + c).join("");
          return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
        };
        const rgb2hex = (a) =>
          "#" +
          a
            .map((v) =>
              Math.round(Math.max(0, Math.min(255, v)))
                .toString(16)
                .padStart(2, "0"),
            )
            .join("")
            .toUpperCase();
        const mix = (a, b, t) => rgb2hex(hex2rgb(a).map((v, i) => v + (hex2rgb(b)[i] - v) * t));
        function ramp(base) {
          const tint = [0.92, 0.84, 0.68, 0.5, 0.28],
            shade = [0.14, 0.3, 0.45, 0.6, 0.72],
            out = {};
          STEPS.forEach((s, i) => {
            out[s] =
              i < 5
                ? mix(base, "#FFFFFF", tint[i])
                : i === 5
                  ? base.toUpperCase()
                  : mix(base, "#000000", shade[i - 6]);
          });
          return out;
        }
        function lum(h) {
          return hex2rgb(h)
            .map((v) => {
              v /= 255;
              return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            })
            .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
        }
        function contrast(a, b) {
          const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m);
          return (x + 0.05) / (y + 0.05);
        }
        function grade(r) {
          return r >= 7
            ? ["AAA", "ok"]
            : r >= 4.5
              ? ["AA", "ok"]
              : r >= 3
                ? ["AA Large", "warn"]
                : ["Decorative", "bad"];
        }

        const P = Object.fromEntries(Object.entries(BRAND.colors).map(([k, v]) => [k, ramp(v)]));
        const onBrand = contrast(P.brand[600], "#FFFFFF") >= 4.5 ? "#FFFFFF" : P.neutral[950];

:root[data-theme="dark"]{color-scheme:dark;${block(SEM.dark)}}`;

        document.addEventListener("click", (e) => {
          const b = e.target.closest("[data-copy]");
          if (!b) return;
          const v = b.getAttribute("data-copy");
          const done = () => toast("Copied " + (v.length > 40 ? "to clipboard" : v));
          try {
            navigator.clipboard.writeText(v).then(done, () => fallback(v));
          } catch (_) {
            fallback(v);

          function fallback(t) {
            const ta = document.createElement("textarea");
            ta.value = t;

        /* ---------- Logo generator (placeholder until real SVGs are dropped in) ---------- */
        function logoSVG(kind, fg, mark, bgAccent) {
          const n = esc(BRAND.client.name),
            fd = esc(F.display.family);
          const sym = (x, y, s) =>
            `<g transform="translate(${x} ${y}) scale(${s / 100})"><rect width="100" height="100" rx="${Math.min(30, BRAND.radius * 2.4)}" fill="${mark}"/><circle cx="50" cy="50" r="24" fill="none" stroke="${bgAccent}" stroke-width="11"/><circle cx="50" cy="50" r="8" fill="${bgAccent}"/></g>`;
          if (kind === "symbol")
            return `<svg viewBox="0 0 100 100" width="96" height="96" role="img" aria-label="${n} symbol">${sym(0, 0, 100)}</svg>`;
          // Widen the viewBox for long names so the placeholder scales down instead of being cut off.
          const textW = (size) => String(BRAND.client.name || "").length * size * 0.56;
          if (kind === "wordmark") {
            const w = Math.max(300, Math.ceil(textW(54) + 20));
            return `<svg viewBox="0 0 ${w} 80" width="240" role="img" aria-label="${n} wordmark"><text x="${w / 2}" y="56" text-anchor="middle" font-family="${fd}" font-weight="700" font-size="54" letter-spacing="-2" fill="${fg}">${n.toLowerCase()}</text></svg>`;
          }
          if (kind === "stacked") {
            const w = Math.max(220, Math.ceil(textW(48) + 20));
            return `<svg viewBox="0 0 ${w} 190" width="170" role="img" aria-label="${n} stacked logo">${sym((w - 80) / 2, 0, 80)}<text x="${w / 2}" y="160" text-anchor="middle" font-family="${fd}" font-weight="700" font-size="48" letter-spacing="-2" fill="${fg}">${n.toLowerCase()}</text></svg>`;
          }
          const w = Math.max(330, Math.ceil(100 + textW(54) + 10));
          return `<svg viewBox="0 0 ${w} 90" width="250" role="img" aria-label="${n} primary logo">${sym(0, 5, 80)}<text x="100" y="64" font-family="${fd}" font-weight="700" font-size="54" letter-spacing="-2" fill="${fg}">${n.toLowerCase()}</text></svg>`;
        }
        // variant: 'full' (default), 'light' (for dark/brand backgrounds), 'dark' (one-color dark)
        const logoSrc = (l, variant) =>
          variant === "light"
            ? l.srcLight || l.src
            : variant === "dark"
              ? l.srcDark || l.src
              : l.src || l.srcDark || l.srcLight;
        const logoFor = (l, fg, mark, acc, variant = "full") => {
          const src = l && logoSrc(l, variant);
          return l && l.svg
            ? l.svg

              ? `<img src="${esc(src)}" alt="${esc(BRAND.client.name)} ${esc(l.name)} logo">`
              : logoSVG(l ? l.kind : "primary", fg, mark, acc);

        /* ---------- Palette downloads: Adobe swatches, swatch sheet, CSS, JSON ---------- */
        function aseBlob(swatches) {
          const blocks = swatches.map(([name, hex]) => {
            const nm = name + "\0",
              len = 2 + nm.length * 2 + 4 + 12 + 2,
              v = new DataView(new ArrayBuffer(6 + len));
            let o = 0;
            v.setUint16(o, 1);
            v.setUint32((o += 2), len);
            v.setUint16((o += 4), nm.length);
            o += 2;
            for (let i = 0; i < nm.length; i++, o += 2) v.setUint16(o, nm.charCodeAt(i));
            for (let i = 0; i < 4; i++, o++) v.setUint8(o, "RGB ".charCodeAt(i));
            hex2rgb(hex).forEach((c) => {
              v.setFloat32(o, c / 255);
              o += 4;
            });
            v.setUint16(o, 2);
            return v.buffer;
          });
          const h = new DataView(new ArrayBuffer(12));
          for (let i = 0; i < 4; i++) h.setUint8(i, "ASEF".charCodeAt(i));
          h.setUint16(4, 1);
          h.setUint16(6, 0);
          h.setUint32(8, blocks.length);
          return new Blob([h.buffer, ...blocks], { type: "application/octet-stream" });
        }
        let _palette = null;
        function paletteFiles() {
          if (_palette) return _palette;
          const base = fileBase().replace("%", "Color-Palette"),
            rows = Object.entries(P);
          const sw = rows.flatMap(([n, r]) => STEPS.map((s) => [`${n}/${s}`, r[s]]));
          const W = 140 + STEPS.length * 80,
            H = rows.length * 90 + 30;
          const svg =
            `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/>` +
            rows
              .map(
                ([n, r], i) =>
                  `<text x="20" y="${i * 90 + 60}" font-size="15" font-weight="700" fill="#14181D">${n}</text>` +
                  STEPS.map((s, j) => {
                    const x = 140 + j * 80,
                      y = i * 90 + 20,
                      fg = contrast(r[s], "#FFFFFF") >= 4.5 ? "#FFFFFF" : "#111418";
                    return `<rect x="${x}" y="${y}" width="80" height="70" fill="${r[s]}"/><text x="${x + 6}" y="${y + 48}" font-size="11" font-weight="700" fill="${fg}">${s}</text><text x="${x + 6}" y="${y + 62}" font-size="10" fill="${fg}">${r[s]}</text>`;
                  }).join(""),
              )
              .join("") +
            `</svg>`;
          const css = `/* ${C.fullName} color palette ${C.version} */\n:root {\n${rows.flatMap(([n, r]) => STEPS.map((s) => `  --${n}-${s}: ${r[s]};`)).join("\n")}\n}\n`;
          const json = JSON.stringify(
            Object.fromEntries(
              rows.map(([n, r]) => [

              ]),
            ),
            null,
            2,
          );
          _palette = [
            genFile(base + ".ase", aseBlob(sw), "application/octet-stream", "Adobe swatches (.ase)"),
            genFile(base + ".svg", svg, "image/svg+xml", "Swatch sheet (.svg)"),
            genFile(base + ".css", css, "text/css", "CSS variables (.css)"),

        /* ---------- Hero background (set per client in the builder) ---------- */
        function heroLook() {
          const H = Object.assign(
            { bg: "brand", ring: true, text: "auto", overlay: 35, angle: 135 },
            BRAND.hero || {},
          );
          const ok = (h) => /^#[0-9a-f]{6}$/i.test(String(h || ""));
          const dark = P.neutral[950];
          const pickText = (tone) =>
            H.text === "light"
              ? "#FFFFFF"
              : H.text === "dark"
                ? dark
                : contrast(tone, "#FFFFFF") >= contrast(tone, dark)
                  ? "#FFFFFF"
                  : dark;
          let bg = "",
            tone = null;
          if (H.bg === "accent") tone = bg = P.accent[500];
          else if (H.bg === "dark") tone = bg = dark;
          else if (H.bg === "light") tone = bg = P.neutral[50];
          else if (H.bg === "custom" && ok(H.color)) tone = bg = H.color;
          else if (H.bg === "gradient" && ok(H.color) && ok(H.color2)) {
            bg = `linear-gradient(${Number(H.angle) || 0}deg, ${H.color}, ${H.color2})`;
            // Text sits across both ends: pick the color whose worse end still reads best.
            const worst = (fg) => Math.min(contrast(H.color, fg), contrast(H.color2, fg));
            tone = worst("#FFFFFF") >= worst(dark) ? P.neutral[950] : "#FFFFFF";
          } else if (H.bg === "image" && H.image) {
            const a = Math.max(0, Math.min(0.9, (Number(H.overlay) || 0) / 100));
            bg = `linear-gradient(rgba(0,0,0,${a}), rgba(0,0,0,${a})), url("${H.image}") center / cover no-repeat, ${dark}`;
            tone = mix(dark, "#FFFFFF", 0.5 - a * 0.5);
          }
          const fg = tone ? pickText(tone) : H.text === "auto" ? "" : pickText(P.brand[600]);
          const style = (bg ? `background:${bg};` : "") + (fg ? `color:${fg};` : "");

          const f = F[k],
            files = f.files || [];
          if (files.length === 1) return dlBtn(files[0], "Download");
          if (files.length > 1)
            return `<details class="dl-menu"><summary class="btn" data-variant="secondary" data-size="sm">Download ▾</summary><div class="dl-pop">${files.map((x) => `<a href="${esc(x.src)}" download="${esc(x.name)}">${esc(x.name)}</a>`).join("")}</div></details>`;
          if (f.url) return dlBtn({ src: f.url, external: true }, "Download");
          return `<span class="btn" data-variant="secondary" data-size="sm" aria-disabled="true">Download · pending</span>`;
        }
        function familyCard(k) {
          const f = F[k],
            on = typeView === k;
          return `<div class="card family${on ? " viewing" : ""}" data-fam="${k}"><div class="eyebrow">${k}</div>
    <div class="big" style="font-family:${fam(f)};font-weight:${f.weights[f.weights.length - 1]}">Aa</div>
    <b style="font-family:${fam(f)};font-size:18px">${esc(f.family)}</b><small>Weights ${f.weights.join(" · ")} · ${esc(f.source)}</small>
    <small>Fallback: ${esc(f.fallback)}</small>
    <div class="fam-actions">${fontDl(k)}<button type="button" class="btn" data-variant="${on ? "primary" : "secondary"}" data-size="sm" data-view="${k}" aria-pressed="${on}" title="Show the type scale in ${esc(f.family)}">${on ? "Viewing" : "View"}</button></div></div>`;
        }
        function typeScaleRows() {
          return BRAND.typeScale
            .map((t) => {
              const role = typeView || t.font;
              return `<div class="type-row"><div class="spec"><code>${t.token}</code><br>${t.size}/${t.lh} · mobile ${t.m}<br>${t.w} · ${t.track}% · ${t.use}${typeView && typeView !== t.font ? `<br><span style="color:var(--text-brand)">shown in ${esc(F[typeView].family)}</span>` : ""}</div>
    <div class="sample" style="font-family:var(--font-${role});font-size:clamp(${t.m}px,${(t.size / 12).toFixed(2)}vw,${t.size}px);line-height:${(t.lh / t.size).toFixed(3)};font-weight:${t.w};letter-spacing:${t.track / 100}em">${t.size >= 26 ? esc(C.tagline) : esc(D.sentence)}</div></div>`;
            })
            .join("");
        }
        const typeViewBar = () =>
          typeView
            ? `<span class="pill brand">Showing every style in ${esc(F[typeView].family)} (${ROLE_NAME[typeView]})</span><button type="button" class="copy" data-view-reset>Reset to spec</button>`
