          let c = n;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          t[n] = c >>> 0;
        }
        return t;
      })();
      function crc32(bytes) {
        let c = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
        return (c ^ 0xffffffff) >>> 0;
      }
      class ZipWriter {
        constructor() {
          this.entries = [];
        }
        file(path, data) {
          this.entries.push({ path, data });
          return this;
        }
        folder(prefix) {
          return {
            file: (path, data) => {
              this.entries.push({ path: `${prefix}/${path}`, data });
              return this;
            },
          };
        }
        async toBlob() {
          const enc = new TextEncoder(),
            parts = [],
            central = [];
          const now = new Date();
          const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
          const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
          let offset = 0;
          for (const e of this.entries) {
            const bytes =
              typeof e.data === "string" ? enc.encode(e.data) : new Uint8Array(await e.data.arrayBuffer());
            const name = enc.encode(e.path),
              crc = crc32(bytes);
            const local = new DataView(new ArrayBuffer(30));
            local.setUint32(0, 0x04034b50, true);
            local.setUint16(4, 20, true);
            local.setUint16(6, 0x0800, true);
            local.setUint16(8, 0, true);
            local.setUint16(10, time, true);
            local.setUint16(12, date, true);
            local.setUint32(14, crc, true);
            local.setUint32(18, bytes.length, true);
            local.setUint32(22, bytes.length, true);
            local.setUint16(26, name.length, true);
            local.setUint16(28, 0, true);
            parts.push(local.buffer, name, bytes);
            const cd = new DataView(new ArrayBuffer(46));
            cd.setUint32(0, 0x02014b50, true);
            cd.setUint16(4, 20, true);
            cd.setUint16(6, 20, true);
            cd.setUint16(8, 0x0800, true);
            cd.setUint16(10, 0, true);
            cd.setUint16(12, time, true);
            cd.setUint16(14, date, true);
            cd.setUint32(16, crc, true);
            cd.setUint32(20, bytes.length, true);
            cd.setUint32(24, bytes.length, true);
            cd.setUint16(28, name.length, true);
            cd.setUint32(42, offset, true);
            central.push(cd.buffer, name);
            offset += 30 + name.length + bytes.length;
          }
          const cdSize = central.reduce((n, p) => n + (p.byteLength ?? p.length), 0);
          const end = new DataView(new ArrayBuffer(22));
          end.setUint32(0, 0x06054b50, true);
          end.setUint16(8, this.entries.length, true);
          end.setUint16(10, this.entries.length, true);
          end.setUint32(12, cdSize, true);
          end.setUint32(16, offset, true);
          return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
        }
      }

      /* Palette files for 03_Color (the dashboard makes the same four for its download buttons). */
      function paletteFiles(cfg) {
        const [slug, ver] = slugVer(cfg),
          base = `${slug}_Color-Palette_${ver}`;
        const P = Object.entries(cfg.colors).map(([k, v]) => [k, ramp(validHex(v) ? normHex(v) : "#777777")]);
        const sw = P.flatMap(([n, r]) => STEPS.map((s) => [`${n}/${s}`, r[s]]));
        const blocks = sw.map(([name, hex]) => {
          const nm = name + "\0",
            len = 2 + nm.length * 2 + 4 + 12 + 2,
            v = new DataView(new ArrayBuffer(6 + len));
          let o = 0;
          v.setUint16(o, 1);
          v.setUint32((o += 2), len);
          v.setUint16((o += 4), nm.length);
          o += 2;
          for (let i = 0; i < nm.length; i++, o += 2) v.setUint16(o, nm.charCodeAt(i));
          for (let i = 0; i < 4; i++, o++) v.setUint8(o, "RGB ".charCodeAt(i));
          hex2rgb(hex).forEach((c) => {
            v.setFloat32(o, c / 255);
            o += 4;
          });
          v.setUint16(o, 2);
          return v.buffer;
        });
        const h = new DataView(new ArrayBuffer(12));
        for (let i = 0; i < 4; i++) h.setUint8(i, "ASEF".charCodeAt(i));
        h.setUint16(4, 1);
        h.setUint32(8, blocks.length);
        const W = 140 + STEPS.length * 80,
          H = P.length * 90 + 30;
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/>` +
          P.map(
            ([n, r], i) =>
              `<text x="20" y="${i * 90 + 60}" font-size="15" font-weight="700" fill="#14181D">${n}</text>` +
              STEPS.map((s, j) => {
                const x = 140 + j * 80,
                  y = i * 90 + 20,
                  fg = contrast(r[s], "#FFFFFF") >= 4.5 ? "#FFFFFF" : "#111418";
                return `<rect x="${x}" y="${y}" width="80" height="70" fill="${r[s]}"/><text x="${x + 6}" y="${y + 48}" font-size="11" font-weight="700" fill="${fg}">${s}</text><text x="${x + 6}" y="${y + 62}" font-size="10" fill="${fg}">${r[s]}</text>`;
              }).join(""),
          ).join("") +
          `</svg>`;
        return {
          [base + ".ase"]: new Blob([h.buffer, ...blocks], { type: "application/octet-stream" }),
          [base + ".svg"]: svg,
          [base + ".css"]: `/* ${cfg.client.fullName} color palette ${cfg.client.version} */\n:root {\n${P.flatMap(([n, r]) => STEPS.map((s) => `  --${n}-${s}: ${r[s]};`)).join("\n")}\n}\n`,
          [base + ".json"]: JSON.stringify(
            Object.fromEntries(
              P.map(([n, r]) => [
                n,
                Object.fromEntries(STEPS.map((s) => [s, { hex: r[s], rgb: hex2rgb(r[s]).join(", ") }])),
              ]),
            ),
            null,
            2,
          ),
        };
      }

      async function exportZip() {
        if (!cur || !tplHTML) return;
        const cfg = cur.config,
          c = cfg.client,
          [slug, ver] = slugVer(cfg);
        toast("Building the handoff package…", 10000);
        try {
          const zip = new ZipWriter(),
            root = zip.folder(`${slug}_Brand-System_${ver}`);
          // Every stored file goes into its numbered folder; the dashboards point at these paths.
          const paths = {},
            used = new Set();
          const put = async (dir, name, ref) => {
            let p = `${dir}/${name}`,
              n = 2;
            while (used.has(p.toLowerCase())) p = `${dir}/${name.replace(/(\.[^.]+)?$/, `-${n++}$1`)}`;
            used.add(p.toLowerCase());
            root.file(p, await fetchBlob(assetUrl(ref)));
            paths[ref.id] = p;
            return p;
          };
          const logoPaths = {};
          for (const l of cfg.logos)
            for (const v of ["full", "light", "dark"])
              if (l[v]) logoPaths[`${l.kind}:${v}`] = await put("02_Logo", NAMES.logo(cfg, l, v), l[v]);
          const faceLines = [];
          for (const r of ["display", "body", "mono"]) {
            const F = cfg.fonts[r];
            if (F.source !== "upload") continue;
            for (const x of F.faces || []) {
              if (!x.asset) continue;
              const nm = (await put("04_Typography/Fonts", NAMES.font(F, x), x.asset)).split("/").pop();
              faceLines.push(
                `@font-face { font-family: "${F.family}"; src: url("../../public/assets/fonts/${nm}") format("${fontFormat(nm)}"); font-weight: ${x.weight}; font-style: ${x.style || "normal"}; font-display: swap; }`,
              );
            }
          }
          for (const [i, t] of cfg.templates.entries())
            if (t.image) await put("06_Templates/Thumbnails", NAMES.tpl(cfg, t, i), t.image);
          if (cfg.hero.bg === "image" && cfg.hero.image) await put("05_Imagery", NAMES.hero(cfg), cfg.hero.image);
          for (const d of cfg.downloads)
            if (dlShown(cfg, d)) for (const a of d.attachments || []) await put(d.folder, a.name || "file", a);
          if (sectionOn(cfg, "threed")) {
            const T = cfg.threeD;
            if (T.folder?.zip) await put("07_3D-Assets", NAMES.folder3d(cfg), T.folder.zip);
            for (const [i, m] of T.items.entries())
              for (const v of m.views) if (v.image) await put("07_3D-Assets/Views", NAMES.view(cfg, m, i, v), v.image);
          }
          if (dlShown(cfg, cfg.downloads.find((d) => d.kind === "color") || {}))
            for (const [n, body] of Object.entries(paletteFiles(cfg))) root.file(`03_Color/${n}`, body);

          // Two copies of the dashboard: index.html at the top (for GitHub Pages or any web host)
          // and one in 00_START-HERE. Both read the files from the numbered folders.
          const brandAt = (prefix) =>
            toBrand(cfg, (r) =>
              r && paths[r.id] ? prefix + paths[r.id].split("/").map(encodeURIComponent).join("/") : "",
            );
          root.file("index.html", dashboardDoc(brandAt("")));
          root.file(`00_START-HERE/${slug}_Brand-Hub_${ver}.html`, dashboardDoc(brandAt("../")));
          root.file(".nojekyll", "");

          if (cfg.scope.website) {
            for (const [n, body] of Object.entries(tokenFiles(cfg))) root.file(`08_Code/tokens/${n}`, body);
            // React kit config (drop into brand-hub-kit/)
            const kit = toBrand(cfg, () => "");
            kit.logos = cfg.logos.map((l) => ({
              name: l.name,
              use: l.use,
              kind: l.kind,
              src: logoPaths[`${l.kind}:full`] ? "assets/logos/" + logoPaths[`${l.kind}:full`].split("/").pop() : "",
              srcLight: logoPaths[`${l.kind}:light`] ? "assets/logos/" + logoPaths[`${l.kind}:light`].split("/").pop() : "",
              srcDark: logoPaths[`${l.kind}:dark`] ? "assets/logos/" + logoPaths[`${l.kind}:dark`].split("/").pop() : "",
            }));
            kit.templates = cfg.templates.map((t) => ({ ...t, image: "" }));
            kit.colorOverrides = {};
            delete kit.fonts.faces;
            delete kit.codeKit;
            delete kit.threeD;
            delete kit.hero;
            root.file(
              "08_Code/react-kit/brand.config.js",
              `// Generated by Brand Builder for ${c.fullName} ${c.version}.\n// Copy into brand-hub-kit/, copy 02_Logo files into public/assets/logos/, then run npm run dev.\nexport default ${JSON.stringify(kit, null, 2)};\n`,
            );
            if (faceLines.length)
              root.file(
                "08_Code/react-kit/fonts.css",
                `/* Copy font files from 04_Typography/Fonts into public/assets/fonts/ and import this file in src/main.jsx */\n${faceLines.join("\n")}\n`,
              );
          }

          const folders = cfg.downloads
            .filter((d) => dlShown(cfg, d))
            .map((d) => `${d.folder.padEnd(22)}${d.title}`)
            .join("\n");
          root.file(
            "00_START-HERE/README.txt",
            `${c.fullName} — Brand System ${c.version}

OPEN THE DASHBOARD
Open index.html (or 00_START-HERE/${slug}_Brand-Hub_${ver}.html) in any browser.
Keep this folder together: the dashboard shows and downloads the files in the numbered folders.

WHAT'S INSIDE
${folders}

PUT IT ONLINE WITH GITHUB PAGES
1. Create a new repository on github.com.
2. Upload everything inside this folder: index.html at the top level, the .nojekyll file
   and the numbered folders. (Drag them onto "uploading an existing file".)
3. Settings → Pages → Build and deployment → Source: "Deploy from a branch",
   Branch: main, folder: / (root). Save.
4. After a minute the dashboard is live at https://<account>.github.io/<repository>/
GitHub refuses single files over 100 MB. Host larger files (big 3D folders) on a drive
and paste the link into the matching card in the Downloads step.

Questions: ${cfg.contacts.map((p) => `${p.name} <${p.email}>`).join(", ")}
`,
          );
          const blob = await zip.toBlob();
          if ((await saveFile(`${slug}_Brand-System_${ver}.zip`, blob)) && downloads !== plainDownloads)
            toast("Handoff package saved");
        } catch (e) {
          console.error(e);
          toast("Export failed. Check your connection and try again.", 3500);
        }
      }

      /* ======================================================================
   STANDALONE MODE: browser storage (IndexedDB) and plain downloads
   Used when the page runs as a file on your computer or any web host.
   ====================================================================== */
      function idb() {
        return new Promise((res, rej) => {
          const r = indexedDB.open("brand-builder-local-v3", 1);
          r.onupgradeneeded = () => {
            r.result.createObjectStore("docs");
            r.result.createObjectStore("files");
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      }
      const tx = (d, store, mode, fn) =>
        new Promise((res, rej) => {
          const t = d.transaction(store, mode);
          const out = fn(t.objectStore(store));
          t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out);
          t.onerror = () => rej(t.error);
        });
      async function openLocalStore() {
        const d = await idb();
        // Load stored files so they display instantly
        const keys = await tx(d, "files", "readonly", (s) => s.getAllKeys());
        for (const k of keys) {
          const blob = await tx(d, "files", "readonly", (s) => s.get(k));
          if (blob) localBlobs.set(k, URL.createObjectURL(blob));
        }
        const subs = [];
        const snap = (id, body) => ({
          id,
          exists: !!body,
          data: () => body,
          metadata: { fromCache: false, hasPendingWrites: false },
        });
        const all = async () => {
          const ks = await tx(d, "docs", "readonly", (s) => s.getAllKeys());
          const out = [];
          for (const k of ks)
            out.push(snap(k.split("/")[1], await tx(d, "docs", "readonly", (s) => s.get(k))));
          return out;
        };
        const emit = async () => {
          const docs = await all();
          subs.forEach((fn) => fn({ docs }));
        };
        const db = {
          doc: (p) => ({
            id: p.split("/")[1],
            path: p,
            get: async () => snap(p.split("/")[1], await tx(d, "docs", "readonly", (s) => s.get(p))),
            set: async (body) => {
              await tx(d, "docs", "readwrite", (s) => s.put(clone(body), p));
              setTimeout(emit, 0);
            },
            delete: async () => {
              await tx(d, "docs", "readwrite", (s) => s.delete(p));
              setTimeout(emit, 0);
            },
          }),
          collection: () => ({
            onSnapshot: (fn) => {
              subs.push(fn);
              all().then((docs) => fn({ docs }));
              return () => {};
            },
          }),
        };
        const assets = {
          upload: async (blob, o) => {
            const id = "local-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            const typed = o?.type && blob.type !== o.type ? new Blob([blob], { type: o.type }) : blob;
            await tx(d, "files", "readwrite", (s) => s.put(typed, id));
            localBlobs.set(id, URL.createObjectURL(typed));
            return { id, url: localBlobs.get(id), sizeBytes: typed.size, contentType: typed.type };
          },
        };
        return { db, assets };
      }
      // The file is shown in a dialog with a Save button. Nothing downloads until you click it.
      const plainDownloads = {
        save: async ({ filename, data }) => {
          const blob = data instanceof Blob ? data : new Blob([data]);
          const dlg = $("#save-dialog"),
            link = $("#save-link");
          if (link.dataset.url) URL.revokeObjectURL(link.dataset.url);
          const url = URL.createObjectURL(blob);
          link.dataset.url = url;
          link.href = url;
          link.setAttribute("download", filename);
          $("#save-name").textContent = filename;
          $("#save-size").textContent =
            blob.size > 1048576
              ? (blob.size / 1048576).toFixed(1) + " MB"
              : Math.max(1, Math.round(blob.size / 1024)) + " KB";
          $("#toast").classList.remove("show");
          dlg.hidden = false;
          link.focus();
          return { status: "saved" };
        },
      };

      /* ---------- Backup and restore (moves a client between browsers or teammates) ---------- */
      async function mapRefs(cfg, fn) {
        for (const l of cfg.logos) for (const v of ["full", "light", "dark"]) if (l[v]) l[v] = await fn(l[v]);
        for (const r of ["display", "body", "mono"])
          for (const x of cfg.fonts[r].faces || []) if (x.asset) x.asset = await fn(x.asset);
        for (const t of cfg.templates) if (t.image) t.image = await fn(t.image);
        if (cfg.hero?.image) cfg.hero.image = await fn(cfg.hero.image);
        for (const d of cfg.downloads || [])
          if (d.attachments) {
            for (let i = 0; i < d.attachments.length; i++) d.attachments[i] = await fn(d.attachments[i]);
            d.attachments = d.attachments.filter(Boolean);
          }
        if (cfg.threeD?.folder?.zip) {
          cfg.threeD.folder.zip = await fn(cfg.threeD.folder.zip);
          if (!cfg.threeD.folder.zip) cfg.threeD.folder = null;
        }
        for (const m of cfg.threeD?.items || []) for (const v of m.views) if (v.image) v.image = await fn(v.image);
        return cfg;
      }
      async function exportBackup() {
        if (!cur) return;
        toast("Packing the backup…", 6000);
        try {
          const cfg = await mapRefs(clone(cur.config), async (r) => ({
            name: r.name,
            type: r.type,
            data: await toDataUrl(assetUrl(r)),
          }));
          const c = cur.config.client;
          const body = JSON.stringify({
            kind: "brand-builder-backup",
            version: 1,
            savedAt: new Date().toISOString(),
            config: cfg,
          });
          if (
            (await saveFile(
              `${safe(c.slug) || "CLIENT"}_Brand-Builder-Backup_${today()}.json`,
              new Blob([body], { type: "application/json" }),
            )) &&
            downloads !== plainDownloads
          )
            toast("Backup saved");
        } catch {
          toast("Backup failed. Try again.", 3500);
        }
      }
      async function importBackup(file) {
        let data;
        try {
          data = JSON.parse(await file.text());
        } catch {
          toast(`${file.name} isn’t a Brand Builder backup.`, 3500);
          return;
        }
        if (data?.kind !== "brand-builder-backup" || !data.config) {
          toast(`${file.name} isn’t a Brand Builder backup.`, 3500);
          return;
        }
        if (!assets) {
          toast("Saving files isn’t available in this browser window");
          return;
        }
        toast("Restoring…", 10000);
        try {
          const cfg = await mapRefs(normalize(data.config), async (r) => {
            if (!r.data) return null;
            const blob = await (await fetch(r.data)).blob();
            return await uploadBlob(
              new File([blob], r.name || "file", { type: r.type || blob.type }),
              r.type,
            );
          });
          if (clients.some((c) => c.name === cfg.client.name)) cfg.client.name += " (restored)";
          await createClient(cfg);
          toast(`Restored ${cfg.client.name}`);
        } catch (e) {
          toast(uploadError(e), 3500);
        }
      }

      /* ======================================================================
   MENUS, THEME
   ====================================================================== */
      function closeMenus() {
        document.querySelectorAll(".menu-pop").forEach((p) => (p.hidden = true));
        document.querySelectorAll("[aria-haspopup]").forEach((b) => b.setAttribute("aria-expanded", "false"));
      }
      [
        ["#more-btn", "#more-pop"],
        ["#export-btn", "#export-pop"],
      ].forEach(([b, p]) =>
        $(b).addEventListener("click", (e) => {
          e.stopPropagation();
          const open = $(p).hidden;
          closeMenus();
          $(p).hidden = !open;
          $(b).setAttribute("aria-expanded", String(open));
        }),
      );
      $("#new-client").addEventListener("click", () => requestNewClient());
      const closeSave = () => {
        $("#save-dialog").hidden = true;
      };
      $("#save-close").addEventListener("click", closeSave);
      $("#save-link").addEventListener("click", () => setTimeout(closeSave, 300));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("#save-dialog").hidden) closeSave();
      });
      function setTheme(t) {
        t === "system"
          ? document.documentElement.removeAttribute("data-theme")
          : document.documentElement.setAttribute("data-theme", t);
        document
          .querySelectorAll("#theme-seg [data-t]")
          .forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === t));
        store.set("bb-theme", t);
      }
      setTheme(store.get("bb-theme", "system"));

      /* ======================================================================
   BOOT
   ====================================================================== */
      initializeBuilderTools();
      tplHTML = document.getElementById("dashboard-template").innerHTML;

      setStatus("idle", "Opening…");
      renderEmpty("Opening your saved clients…");
      (async () => {
        localMode = true;
        downloads = plainDownloads;
        try {
          const local = await openLocalStore();
          db = local.db;
          assets = local.assets;
          await loadSavedProjects();
        } catch {
          // Private windows and some browser settings block storage: work without saving.
          setStatus("error", "Not saving: this browser blocks storage");
          cur = { id: "local", config: defaultConfig() };
          clients = [{ id: "local", name: cur.config.client.name }];
          renderClientSelect();
          renderPanel();
          refreshPreview();
          loadFontSamples();
          return;
        }
        let first = true;
        db.collection("clients").onSnapshot(
          (snap) => {
            clients = snap.docs.map((d) => ({
              id: d.id,
              name: d.data().name,
              updatedAt: d.data().updatedAt,
            }));
            if (first) {
              first = false;
              const want = store.get("bb-client", null);
              const pick =
                clients.find((c) => c.id === want) ||
                clients.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))[0];
              if (pick) openClient(pick.id);
              else {
                renderEmpty();
                renderClientSelect();
                setStatus("idle", "No clients yet");
              }
              return;
            }
            renderClientSelect();
            // Someone else changed the client you have open: take their version if you have nothing unsaved.
            const mine = cur && snap.docs.find((d) => d.id === cur.id);
            if (mine && !dirty && !mine.metadata.hasPendingWrites && mine.data().rev !== lastRev) {
              cur.config = normalize(clone(mine.data().config));
              lastRev = mine.data().rev;
              renderPanel();
              refreshPreview();
              loadFontSamples();
              toast("Updated from another tab");
            }
            if (cur && !snap.docs.find((d) => d.id === cur.id) && cur.id !== "local" && !dirty) {
              cur = null;
              clients.length ? openClient(clients[0].id) : renderEmpty();
            }
          },
          () => setStatus("error", "Lost connection to saved clients. Reload to reconnect."),
        );
      })();
    </script>
  </body>
</html>
