<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brand Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --bg: #f2f3f5;
        --panel: #ffffff;
        --raised: #f7f8fa;
        --ink: #14161b;
        --muted: #5d6371;
        --faint: #8a909c;
        --line: #e2e4e9;
        --line-strong: #c9cdd5;
        --accent: #f0521f;
        --accent-soft: #fde9e1;
        --accent-ink: #ffffff;
        --ok: #1f8a55;
        --warn: #b7791f;
        --bad: #c23b31;
        --checker: #e9ebef;
        --font: "Geist", "Helvetica Neue", Arial, sans-serif;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --shadow: 0 1px 2px rgba(15, 17, 22, 0.06), 0 8px 24px rgba(15, 17, 22, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0e1013;
          --panel: #16191e;
          --raised: #1c2026;
          --ink: #eceef2;
          --muted: #a1a7b3;
          --faint: #7a808c;
          --line: #252a31;
          --line-strong: #39404a;
          --accent: #ff6d3f;
          --accent-soft: #3a1e14;
          --accent-ink: #140a06;
          --ok: #4cc38a;
          --warn: #e3a948;
          --bad: #f06a5f;
          --checker: #1f242b;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1013;
        --panel: #16191e;
        --raised: #1c2026;
        --ink: #eceef2;
        --muted: #a1a7b3;
        --faint: #7a808c;
        --line: #252a31;
        --line-strong: #39404a;
        --accent: #ff6d3f;
        --accent-soft: #3a1e14;
        --accent-ink: #140a06;
        --ok: #4cc38a;
        --warn: #e3a948;
        --bad: #f06a5f;
        --checker: #1f242b;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      code,
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }

      /* ---------- App frame ---------- */
      .app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100%;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        letter-spacing: -0.01em;
        font-size: 15px;
        margin-right: 6px;
      }
      .wordmark i {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--accent);
        display: grid;
        place-items: center;
        color: var(--accent-ink);
        font-style: normal;
        font-size: 12px;
        font-weight: 700;
      }
      .top select {
        min-width: 180px;
        max-width: 260px;
      }
      .spacer {
        flex: 1;
      }
      .status {
        font-size: 12.5px;
        color: var(--faint);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .status b {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        display: inline-block;
      }
      .status[data-s="saved"] b {
        background: var(--ok);
      }
      .status[data-s="saving"] b {
        background: var(--warn);
      }
      .status[data-s="error"] b {
        background: var(--bad);
      }
      .menu {
        position: relative;
      }
      .menu-pop {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 6px;
        min-width: 280px;
        z-index: 30;
        display: flex;
        flex-direction: column;
      }
      .menu-pop button {
        border: 0;
        background: transparent;
        text-align: left;
        padding: 9px 10px;
        border-radius: 7px;
        cursor: pointer;
      }
      .menu-pop button:hover {
        background: var(--raised);
      }
      .menu-pop small {
        display: block;
        color: var(--faint);
        font-size: 12px;
      }

      .work {
        display: grid;
        grid-template-columns: minmax(360px, 470px) minmax(0, 1fr);
        min-height: 0;
      }
      .panel {
        background: var(--panel);
        border-right: 1px solid var(--line);
        overflow: auto;
        min-height: 0;
      }
      .chips {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        gap: 4px;
        padding: 10px 16px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }
      .chips button {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 999px;
        padding: 4px 11px;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        color: var(--muted);
      }
      .chips button:hover {
        color: var(--ink);
        border-color: var(--line-strong);
      }
      .sec {
        padding: 22px 18px 26px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 14px;
        scroll-margin-top: 52px;
      }
      .sec > header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sec > header h2 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.01em;
      }
      .step-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .step-no {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .sec.is-hidden > :not(header) {
        opacity: 0.55;
      }
      .sec .btn.next {
        align-self: flex-end;
        margin-top: 4px;
      }
      .hint {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.5;
      }
      .chips button span {
        display: inline-grid;
        place-items: center;
        min-width: 17px;
        height: 17px;
        border-radius: 999px;
        background: var(--raised);
        font-size: 10.5px;
        font-weight: 600;
        margin-right: 5px;
        font-variant-numeric: tabular-nums;
      }
      .chips button.on {
        background: var(--ink);
        color: var(--panel);
        border-color: var(--ink);
      }
      .chips button.on span {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .chips button.off {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .review {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .review li {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
      }
      .review .ic {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
      }
      .review .lv-bad .ic {
        background: var(--bad);
      }
      .review .lv-warn .ic {
        background: var(--warn);
      }
      .review .lv-info .ic {
        background: var(--faint);
      }
      .review-ok {
        padding: 12px 14px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--ok) 14%, transparent);
        color: var(--ok);
        font-weight: 600;
      }
      .review-sum {
        font-size: 13.5px;
        margin-bottom: 8px;
      }
      .export-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .follow {
        font-size: 12.5px;
        color: var(--muted);
      }
      .sec > header p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .sec h3 {
        margin: 6px 0 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .f {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .f > span {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
      }
      .f small {
        font-size: 12px;
        color: var(--faint);
      }
      input[type="text"],
      input[type="url"],
      input[type="email"],
      input[type="number"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13.5px;
        min-width: 0;
      }
      textarea {
        resize: vertical;
        min-height: 64px;
        line-height: 1.45;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .row {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr));
      }
      .row2 {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 1fr;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--line-strong);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .btn.primary:hover {
        filter: brightness(1.06);
      }
      .btn.small {
        padding: 4px 9px;
        font-size: 12px;
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      .btn.ghost:hover {
        color: var(--ink);
        background: var(--raised);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--panel);
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .card-head b {
        font-size: 14px;
      }
      .note {
        font-size: 12.5px;
        color: var(--muted);
        background: var(--raised);
        border-radius: 8px;
        padding: 9px 11px;
      }
      .note.warn {
        background: color-mix(in srgb, var(--warn) 14%, transparent);
        color: var(--ink);
      }

      /* ---------- Drop zones ---------- */
      .drop {
        border: 1.5px dashed var(--line-strong);
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        color: var(--muted);
        background: var(--raised);
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .drop b {
        display: block;
        color: var(--ink);
        font-size: 14px;
        margin-bottom: 2px;
      }
      .drop small {
        font-size: 12px;
        color: var(--faint);
      }
      .drop:hover {
        border-color: var(--accent);
      }
      .is-over {
        border-color: var(--accent) !important;
        background: var(--accent-soft) !important;
        border-style: solid !important;
      }
      body.dragging .drop,
      body.dragging .slot,
      body.dragging .color-row {
        outline: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
        outline-offset: 2px;
      }

      .logo-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .slot {
        position: relative;
        aspect-ratio: 4/3;
        border-radius: 10px;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        cursor: pointer;
        overflow: hidden;
        padding: 12px;
        max-width: 100%;
      }
      .slot img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .slot .ph {
        font-size: 11.5px;
        text-align: center;
        line-height: 1.3;
        opacity: 0.75;
      }
      .slot .x {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 0;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        display: none;
      }
      .slot:hover .x,
      .slot:focus-within .x {
        display: block;
      }
      .slot-label {
        font-size: 11.5px;
        color: var(--faint);
        text-align: center;
        margin-top: 4px;
      }
      .slot.bg-light {
        background: #ffffff;
        color: #6b7280;
      }
      .slot.bg-dark {
        background: #15181d;
        color: #b8bec8;
      }
      .slot.bg-check {
        background: repeating-conic-gradient(var(--checker) 0 25%, var(--panel) 0 50%) 0 0/14px 14px;
        color: var(--muted);
      }
      .busy::after {
        content: "";
        position: absolute;
        inset: 0;
        background: color-mix(in srgb, var(--panel) 60%, transparent);
      }

      .seg {
        display: inline-flex;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 2px;
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        cursor: pointer;
        color: var(--muted);
      }
      .seg button[aria-pressed="true"] {
        background: var(--panel);
        color: var(--ink);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .wchips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .wchips button {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 12px;
        cursor: pointer;
        font-variant-numeric: tabular-nums;
      }
      .wchips button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--panel);
        border-color: var(--ink);
      }
      .sample {
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        padding: 10px 12px;
        background: var(--raised);
        border-radius: 8px;
        overflow-wrap: anywhere;
      }
      .face {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 132px 92px 28px;
        gap: 6px;
        align-items: center;
        font-size: 12.5px;
      }
      .face .nm {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .tscale {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .tscale table {
        border-collapse: collapse;
        width: 100%;
        min-width: 430px;
        font-size: 12.5px;
      }
      .tscale th,
      .tscale td {
        padding: 5px 6px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .tscale th {
        font-size: 11px;
        color: var(--faint);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .tscale tr:last-child td {
        border-bottom: 0;
      }
      .tscale input,
      .tscale select {
        padding: 4px 6px;
        font-size: 12.5px;
        border-radius: 6px;
      }
      .tscale input[type="number"] {
        width: 58px;
      }

      .color-row {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 96px;
        gap: 10px;
        align-items: center;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      .color-row input[type="color"] {
        width: 42px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 2px;
        background: var(--panel);
        cursor: pointer;
      }
      .color-row b {
        font-size: 13.5px;
        display: block;
        text-transform: capitalize;
      }
      .color-row small {
        color: var(--faint);
        font-size: 12px;
      }
      .color-row input[type="text"] {
        font-family: var(--mono);
        font-size: 12.5px;
        text-transform: uppercase;
      }
      .ramp-mini {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(11, 1fr);
        height: 14px;
        border-radius: 5px;
        overflow: hidden;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .swatches button {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--line);
        cursor: grab;
      }
      .range-row {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr) 90px;
        gap: 10px;
        align-items: center;
        font-size: 12.5px;
      }
      .srow {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--raised);
      }
      .srow input[type="text"],
      .srow input[type="number"],
      .srow select {
        background: var(--panel);
        padding: 6px 8px;
        font-size: 13px;
      }
      .srow-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .srow-top select {
        width: auto;
      }
      .srow-hint {
        font-size: 12px;
        color: var(--faint);
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slide3 {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr) 60px;
        gap: 8px;
        align-items: center;
      }
      .slide3.meter {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) 60px;
      }
      .num-in {
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .note-in {
        font-size: 12.5px !important;
      }
      .mini-ctl {
        display: flex;
        gap: 2px;
        margin-left: auto;
      }
      .mini-ctl .btn {
        padding: 2px 7px;
      }
      .add-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--muted);
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        cursor: pointer;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .toggles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 6px 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--raised);
      }
      .range-row input[type="text"] {
        padding: 5px 7px;
        font-size: 12.5px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      .tpl-row {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 12px;
      }
      .tpl-row .slot {
        aspect-ratio: 4/5;
      }
      .seg.wrap {
        flex-wrap: wrap;
      }
      .cpair {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 6px;
      }
      .cpair input[type="color"] {
        width: 40px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 2px;
        background: var(--panel);
        cursor: pointer;
      }
      .cpair input[type="text"] {
        font-family: var(--mono);
        text-transform: uppercase;
      }
      .hero-slot {
        max-width: 220px;
      }
      .drop {
        position: relative;
      }
      .drop.small {
        padding: 10px 12px;
      }
      .drop.small b {
        font-size: 13px;
      }
      .att {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 28px;
        gap: 8px;
        align-items: center;
        font-size: 12.5px;
        padding: 4px 4px 4px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
      }
      .att .nm {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .att small {
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .views4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .views4 .slot {
        aspect-ratio: 1/1;
        padding: 6px;
      }
      .view-label {
        margin-top: 4px;
        padding: 4px 6px !important;
        font-size: 12px !important;
        text-align: center;
      }
      .card.is-off > :not(.card-head) {
        opacity: 0.55;
      }
      .parts {
        border-top: 1px dashed var(--line);
        padding-top: 12px;
      }
      .pnote {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        background: var(--ink);
        color: var(--panel);
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 12.5px;
        box-shadow: var(--shadow);
        max-width: calc(100% - 24px);
        text-align: center;
      }

      /* ---------- Preview ---------- */
      .preview {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .pbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex-wrap: wrap;
      }
      .pbar .label {
        font-size: 12.5px;
        color: var(--faint);
      }
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        background: var(--bg);
        overflow: hidden;
      }
      .frames {
        position: relative;
        width: 100%;
        height: 100%;
        transition: width 0.2s;
      }
      .stage[data-w="mobile"] .frames {
        width: 390px;
        max-width: 100%;
        margin-block: 14px;
        height: calc(100% - 28px);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
      }
      .frames iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      .frames iframe.back {
        visibility: hidden;
      }
      .pmsg {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        text-align: center;
        padding: 24px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 16px);
        background: var(--ink);
        color: var(--panel);
        padding: 9px 14px;
        border-radius: 9px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: 0.18s;
        z-index: 50;
        max-width: min(92vw, 520px);
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .dropbar {
        position: fixed;
        left: 50%;
        top: calc(64px + env(safe-area-inset-top, 0px));
        transform: translateX(-50%);
        background: var(--accent);
        color: var(--accent-ink);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        z-index: 40;
        box-shadow: var(--shadow);
        pointer-events: none;
      }

      .save-dialog {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(10, 12, 16, 0.45);
      }
      .save-dialog .card {
        max-width: 420px;
        width: 100%;
        box-shadow: var(--shadow);
        padding: 22px;
        gap: 12px;
      }
      .save-dialog h2 {
        margin: 0;
        font-size: 18px;
      }
      .save-dialog p {
        margin: 0;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .save-dialog .btn {
        text-decoration: none;
      }
      .save-dialog small {
        color: var(--faint);
        font-size: 12px;
      }
      .empty {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 24px;
      }
      .empty .card {
        max-width: 440px;
        text-align: left;
        padding: 24px;
        gap: 12px;
      }
      .empty h2 {
        margin: 0;
        font-size: 20px;
      }

      @media (max-width: 900px) {
        .app {
          height: auto;
          min-height: 100%;
        }
        .work {
          grid-template-columns: minmax(0, 1fr);
        }
        .panel {
          border-right: 0;
          overflow: visible;
        }
        .preview {
          height: 80vh;
          border-top: 1px solid var(--line);
        }
        .chips {
          top: env(safe-area-inset-top, 0px);
        }
        .top select {
          min-width: 0;
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="wordmark"><i>B</i>Brand Builder</div>
        <label class="sr" for="client-select" hidden>Client</label>
        <select id="client-select" aria-label="Client"></select>
        <button class="btn" id="new-client" type="button">New client</button>
        <div class="menu">
          <button class="btn ghost" id="more-btn" type="button" aria-haspopup="true" aria-expanded="false">
            More ▾
          </button>
          <div class="menu-pop" id="more-pop" hidden>
            <button type="button" data-act="duplicate">
              Duplicate this client<small>Start a new brand from this one</small>
            </button>
            <button type="button" data-act="backup">
              Back up this client (.json)<small>Settings plus every logo and font, in one file</small>
            </button>
            <button type="button" data-act="restore">
              Restore a client from backup<small>Or drop a backup .json anywhere on the page</small>
            </button>
            <button type="button" data-act="delete" id="del-btn">
              Delete this client<small>Removes the client and its settings</small>
            </button>
          </div>
        </div>
        <div class="spacer"></div>
        <span class="status" id="status" data-s="idle"><b></b><span>Loading…</span></span>
        <div class="menu">
          <button
            class="btn primary"
            id="export-btn"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Export ▾
          </button>
          <div class="menu-pop" id="export-pop" hidden>
            <button type="button" data-act="export-zip">
              Handoff package (.zip)<small
                >Dashboard as index.html, every download in numbered folders. Ready for GitHub Pages.</small
              >
            </button>
            <button type="button" data-act="export-html">
              Client dashboard only (.html)<small
                >One file with every file inside. Rename to index.html to host it anywhere.</small
              >
            </button>
          </div>
        </div>
      </header>
      <div class="work" id="work">
        <aside class="panel" id="panel" aria-label="Brand settings"></aside>
        <section class="preview" aria-label="Live preview">
          <div class="pbar">
            <span class="label">Live preview</span>
            <div class="seg" role="group" aria-label="Preview width">
              <button type="button" data-w="desktop" aria-pressed="true">Desktop</button
              ><button type="button" data-w="mobile" aria-pressed="false">Phone</button>
            </div>
            <label class="check follow"
              ><input type="checkbox" id="follow" checked /> Follow the step I’m on</label
            >
            <div class="spacer"></div>
            <div class="seg" role="group" aria-label="Builder theme" id="theme-seg">
              <button type="button" data-t="light">Light</button
              ><button type="button" data-t="system">Auto</button
              ><button type="button" data-t="dark">Dark</button>
            </div>
          </div>
          <div class="stage" id="stage" data-w="desktop">
            <div class="frames" id="frames">
              <iframe id="fa" title="Dashboard preview"></iframe>
              <iframe
                id="fb"
                class="back"
                title="Dashboard preview (loading)"
                aria-hidden="true"
                tabindex="-1"
              ></iframe>
            </div>
            <div class="pmsg" id="pmsg" hidden></div>
            <div class="pnote" id="pnote" role="status" hidden></div>
          </div>
        </section>
      </div>
    </div>
    <input type="file" id="picker" multiple hidden />
    <input type="file" id="folder-picker" webkitdirectory multiple hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div
      class="save-dialog"
      id="save-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="save-title"
      hidden
    >
      <div class="card">
        <h2 id="save-title">Your file is ready</h2>
        <p><b id="save-name"></b> · <span id="save-size"></span></p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <a class="btn primary" id="save-link" href="#">Save file</a
          ><button type="button" class="btn" id="save-close">Close</button>
        </div>
        <small>Made on this computer from your own files. Nothing is sent anywhere.</small>
      </div>
    </div>
    <div class="dropbar" id="dropbar" hidden>Drop anywhere. Files are sorted automatically.</div>

    <!-- The client dashboard design. The builder fills it with each client’s brand for the preview and exports. -->
    <template id="dashboard-template">
      <title>Brand Delivery Hub</title>
      <meta
        name="description"
        content="Final brand delivery dashboard: brand, logo, color, type, components, templates, downloads and handoff in one place."
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        id="font-link"
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
      <style>
        /* =====================================================================
   STATIC FALLBACK TOKENS — overwritten at runtime from the BRAND config
   (see <script> below). Kept here so the first paint is never unstyled.
   ===================================================================== */
        :root {
          --bg-canvas: #f6f7f9;
          --bg-surface: #ffffff;
          --bg-raised: #ffffff;
          --bg-muted: #eef0f3;
          --bg-brand: #2b5f8a;
          --bg-brand-subtle: #e8eff5;
          --bg-inverse: #14181d;
          --text-primary: #14181d;
          --text-secondary: #4a5361;
          --text-tertiary: #737d8c;
          --text-on-brand: #ffffff;
          --text-brand: #23506f;
          --text-inverse: #f6f7f9;
          --border-subtle: #e3e6ea;
          --border-default: #cfd4da;
          --border-strong: #9aa3ae;
          --border-focus: #2b5f8a;
          --accent: #e8a33d;
          --success: #2f8f5b;
          --warning: #c9861a;
          --danger: #c8423b;
          --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
          --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
          --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
          --radius: 10px;
          --shadow: 0 1px 2px rgba(20, 24, 29, 0.06), 0 4px 14px rgba(20, 24, 29, 0.06);
        }
        @media (prefers-color-scheme: dark) {
          :root:not([data-theme="light"]) {
            color-scheme: dark;
            --bg-canvas: #0e1216;
            --bg-surface: #161b21;
            --bg-raised: #1d232b;
            --bg-muted: #222932;
            --bg-brand: #5d8fb8;
            --bg-brand-subtle: #1a2a38;
            --bg-inverse: #f6f7f9;
            --text-primary: #eef1f4;
            --text-secondary: #b3bcc7;
            --text-tertiary: #8791a0;
            --text-on-brand: #0e1216;
            --text-brand: #8fb6d6;
            --text-inverse: #14181d;
            --border-subtle: #252c35;
            --border-default: #333c47;
            --border-strong: #566170;
            --border-focus: #8fb6d6;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
          }
        }
        :root[data-theme="dark"] {
          color-scheme: dark;
          --bg-canvas: #0e1216;
          --bg-surface: #161b21;
          --bg-raised: #1d232b;
          --bg-muted: #222932;
          --bg-brand: #5d8fb8;
          --bg-brand-subtle: #1a2a38;
          --bg-inverse: #f6f7f9;
          --text-primary: #eef1f4;
          --text-secondary: #b3bcc7;
          --text-tertiary: #8791a0;
          --text-on-brand: #0e1216;
          --text-brand: #8fb6d6;
          --text-inverse: #14181d;
          --border-subtle: #252c35;
          --border-default: #333c47;
          --border-strong: #566170;
          --border-focus: #8fb6d6;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        * {
          box-sizing: border-box;
        }
        body {
          margin: 0;
          background: var(--bg-canvas);
          color: var(--text-primary);
          font-family: var(--font-body);
          font-size: 15px;
          line-height: 1.55;
          -webkit-font-smoothing: antialiased;
        }
        h1,
        h2,
        h3,
        h4 {
          font-family: var(--font-display);
          margin: 0;
          text-wrap: balance;
          letter-spacing: -0.015em;
          line-height: 1.15;
        }
        p {
          margin: 0;
        }
        a {
          color: var(--text-brand);
        }
        code,
        .mono {
          font-family: var(--font-mono);
          font-size: 0.84em;
        }
        button {
          font: inherit;
          color: inherit;
        }
        :focus-visible {
          outline: 2px solid var(--border-focus);
          outline-offset: 2px;
          border-radius: 4px;
        }

        /* ---------- Shell ---------- */
        .shell {
          display: grid;
          grid-template-columns: 248px minmax(0, 1fr);
          min-height: 100%;
        }
        .side {
          position: sticky;
          top: env(safe-area-inset-top, 0px);
          height: 100vh;
          overflow: auto;
          border-right: 1px solid var(--border-subtle);
          background: var(--bg-surface);
          padding: 22px 14px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .side-brand {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 0 8px;
        }
        .side-brand .mark {
          width: 34px;
          height: 34px;
          flex: none;
        }
        .side-brand b {
          font-family: var(--font-display);
          font-size: 16px;
          display: block;
          line-height: 1.1;
        }
        .side-brand small {
          color: var(--text-tertiary);
          font-size: 12px;
        }
        .nav {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .nav a {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 8px 10px;
          border-radius: 8px;
          color: var(--text-secondary);
          text-decoration: none;
          font-weight: 500;
          font-size: 14px;
        }
        .nav a:hover {
          background: var(--bg-muted);
          color: var(--text-primary);
        }
        .nav a.on {
          background: var(--bg-brand-subtle);
          color: var(--text-brand);
        }
        .nav a span {
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--text-tertiary);
        }
        .side-foot {
          margin-top: auto;
          padding: 12px 10px;
          border-top: 1px solid var(--border-subtle);
          font-size: 12px;
          color: var(--text-tertiary);
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .theme-toggle {
          display: flex;
          gap: 4px;
          background: var(--bg-muted);
          border-radius: 8px;
          padding: 3px;
        }
        .theme-toggle button {
          flex: 1;
          border: 0;
          background: transparent;
          padding: 5px 0;
          border-radius: 6px;
          font-size: 12px;
          cursor: pointer;
          color: var(--text-secondary);
        }
        .theme-toggle button[aria-pressed="true"] {
          background: var(--bg-surface);
          color: var(--text-primary);
          box-shadow: var(--shadow);
        }

        main {
          padding-inline: clamp(16px, 4vw, 56px);
          padding-block: 32px 96px;
          max-width: 1180px;
          width: 100%;
        }
        section {
          padding-block: 44px;
          border-bottom: 1px solid var(--border-subtle);
          scroll-margin-top: 16px;
        }
        section:last-child {
          border-bottom: 0;
        }
        .sec-head {
          display: flex;
          flex-wrap: wrap;
          align-items: end;
          justify-content: space-between;
          gap: 12px;
          margin-bottom: 26px;
        }
        .eyebrow {
          font-size: 11.5px;
          font-weight: 600;
          letter-spacing: 0.09em;
          text-transform: uppercase;
          color: var(--text-tertiary);
          margin-bottom: 6px;
        }
        .sec-head h2 {
          font-size: clamp(26px, 3vw, 34px);
        }
        .sec-head p {
          color: var(--text-secondary);
          max-width: 62ch;
          margin-top: 6px;
        }
        h3 {
          font-size: 18px;
          margin-bottom: 12px;
        }
        .sub {
          margin-top: 34px;
        }

        /* ---------- Primitives ---------- */
        .card {
          background: var(--bg-surface);
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
          padding: 20px;
        }
        .grid {
          display: grid;
          gap: 16px;
        }
        .g2 {
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        }
        .g3 {
          grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
        }
        .g4 {
          grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr));
        }
        /* Card sizes. Wide cards span two columns only where two fit, so phones never scroll sideways. */
        .grid > [data-span="full"] {
          grid-column: 1 / -1;
        }
        .grid:has(> [data-span="2"]) {
          container-type: inline-size;
        }
        @container (min-width: 420px) {
          .g4 > [data-span="2"] {
            grid-column: span 2;
          }
        }
        @container (min-width: 520px) {
          .g3 > [data-span="2"] {
            grid-column: span 2;
          }
        }
        @container (min-width: 680px) {
          .g2 > [data-span="2"] {
            grid-column: span 2;
          }
        }
        .logo-tile[data-span="2"] .logo-stage {
          aspect-ratio: 8/3;
        }
        .logo-tile[data-span="full"] .logo-stage {
          aspect-ratio: auto;
          min-height: 220px;
        }
        .logo-tile[data-span] .logo-stage img {
          max-height: 160px;
        }
        .pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 12px;
          font-weight: 600;
          padding: 3px 9px;
          border-radius: 999px;
          background: var(--bg-muted);
          color: var(--text-secondary);
          white-space: nowrap;
        }
        .pill.ok {
          background: color-mix(in srgb, var(--success) 16%, transparent);
          color: var(--success);
        }
        .pill.warn {
          background: color-mix(in srgb, var(--warning) 18%, transparent);
          color: var(--warning);
        }
        .pill.bad {
          background: color-mix(in srgb, var(--danger) 15%, transparent);
          color: var(--danger);
        }
        .pill.brand {
          background: var(--bg-brand-subtle);
          color: var(--text-brand);
        }
        .copy {
          cursor: pointer;
          border: 1px solid var(--border-default);
          background: var(--bg-surface);
          border-radius: 6px;
          padding: 3px 8px;
          font-size: 12px;
          color: var(--text-secondary);
        }
        .copy:hover {
          border-color: var(--border-strong);
          color: var(--text-primary);
        }
        .btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          border-radius: var(--radius);
          font-weight: 600;
          cursor: pointer;
          border: 1px solid transparent;
          text-decoration: none;
          transition:
            background 0.15s,
            border-color 0.15s,
            transform 0.1s;
        }
        .btn:active {
          transform: translateY(1px);
        }
        .btn[data-size="sm"] {
          font-size: 13px;
          padding: 6px 12px;
        }
        .btn[data-size="md"] {
          font-size: 14px;
          padding: 9px 16px;
        }
        .btn[data-size="lg"] {
          font-size: 16px;
          padding: 12px 22px;
        }
        .btn[data-variant="primary"] {
          background: var(--bg-brand);
          color: var(--text-on-brand);
        }
        .btn[data-variant="primary"]:hover {
          filter: brightness(1.08);
        }
        .btn[data-variant="secondary"] {
          background: var(--bg-surface);
          border-color: var(--border-default);
          color: var(--text-primary);
        }
        .btn[data-variant="secondary"]:hover {
          border-color: var(--border-strong);
        }
        .btn[data-variant="ghost"] {
          background: transparent;
          color: var(--text-brand);
        }
        .btn[data-variant="ghost"]:hover {
          background: var(--bg-brand-subtle);
        }
        .btn[data-variant="destructive"] {
          background: var(--danger);
          color: #fff;
        }
        .btn:disabled,
        .btn[aria-disabled="true"] {
          opacity: 0.45;
          cursor: not-allowed;
        }
        .toast {
          position: fixed;
          left: 50%;
          bottom: calc(24px + env(safe-area-inset-bottom, 0px));
          transform: translate(-50%, 20px);
          background: var(--bg-inverse);
          color: var(--text-inverse);
          padding: 9px 16px;
          border-radius: 8px;
          font-size: 13px;
          opacity: 0;
          pointer-events: none;
          transition: 0.2s;
        }
        .toast.show {
          opacity: 1;
          transform: translate(-50%, 0);
        }

        /* ---------- Welcome ---------- */
        .hero {
          display: grid;
          grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
          gap: 28px;
          align-items: stretch;
        }
        .hero-main {
          background: var(--bg-brand);
          color: var(--text-on-brand);
          border-radius: calc(var(--radius) * 1.6);
          padding: clamp(24px, 4vw, 44px);
          display: flex;
          flex-direction: column;
          gap: 18px;
          position: relative;
          overflow: hidden;
        }
        .hero-main .eyebrow {
          color: inherit;
          opacity: 0.75;
        }
        .hero-main h1 {
          font-size: clamp(34px, 5vw, 58px);
          letter-spacing: -0.03em;
        }
        .hero-main p {
          font-size: 17px;
          opacity: 0.9;
          max-width: 44ch;
        }
        .hero-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: auto;
        }
        .hero-meta .pill {
          background: color-mix(in srgb, currentColor 14%, transparent);
          color: inherit;
        }
        .hero-ring {
          position: absolute;
          right: -70px;
          top: -70px;
          width: 200px;
          height: 200px;
          border-radius: 50%;
          border: 30px solid var(--accent);
          opacity: 0.85;
        }
        .hero-main > :not(.hero-ring) {
          position: relative;
          z-index: 1;
        }
        .facts {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .fact {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px;
          padding: 14px 16px;
          background: var(--bg-surface);
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
        }
        .fact small {
          color: var(--text-tertiary);
          font-size: 12px;
          display: block;
        }
        .fact b {
          font-size: 15px;
        }
        .start {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr));
          gap: 12px;
          margin-top: 22px;
        }
        .start a {
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 16px;
          border-radius: var(--radius);
          border: 1px solid var(--border-subtle);
          background: var(--bg-surface);
          text-decoration: none;
          color: var(--text-primary);
        }
        .start a:hover {
          border-color: var(--border-strong);
        }
        .start a small {
          color: var(--text-secondary);
          font-size: 13px;
        }
        .start a b {
          font-size: 15px;
        }

        /* ---------- Brand ---------- */
        .idea {
          font-family: var(--font-display);
          font-size: clamp(22px, 2.6vw, 30px);
          line-height: 1.25;
          max-width: 30ch;
          letter-spacing: -0.02em;
        }
        .pillar h4 {
          font-size: 17px;
          margin-bottom: 6px;
        }
        .pillar p {
          color: var(--text-secondary);
          font-size: 14px;
        }
        .saylike {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          margin-top: 14px;
          font-size: 13px;
        }
        .saylike div {
          padding: 8px 10px;
          border-radius: 8px;
          background: var(--bg-muted);
        }
        .saylike small {
          display: block;
          font-size: 10.5px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin-bottom: 2px;
        }
        .saylike .yes small {
          color: var(--success);
        }
        .saylike .no small {
          color: var(--danger);
        }
        .slider {
          display: grid;
          grid-template-columns: 110px 1fr 110px;
          gap: 12px;
          align-items: center;
          font-size: 13px;
          color: var(--text-secondary);
        }
        .slider div:last-child {
          text-align: right;
        }
        .track {
          height: 6px;
          background: var(--bg-muted);
          border-radius: 6px;
          position: relative;
        }
        .track i {
          position: absolute;
          top: 50%;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: var(--bg-brand);
          transform: translate(-50%, -50%);
          box-shadow: 0 0 0 3px var(--bg-surface);
        }
        .scale-card {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .scale-card > p {
          color: var(--text-secondary);
          font-size: 14px;
          margin-top: -6px;
        }
        .scale-rows {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .slider .track i b {
          position: absolute;
          top: -24px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 11px;
          font-weight: 600;
          color: var(--text-brand);
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }
        .slider.has-num {
          padding-top: 14px;
        }
        .row-note {
          grid-column: 1/-1;
          font-size: 12.5px;
          color: var(--text-tertiary);
          margin-top: -6px;
        }
        .slider div.row-note:last-child {
          text-align: left;
        }
        .meter-row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 6px 12px;
          align-items: baseline;
          font-size: 14px;
        }
        .meter-row .bar {
          grid-column: 1/-1;
          height: 8px;
          background: var(--bg-muted);
          border-radius: 8px;
          overflow: hidden;
        }
        .meter-row .bar i {
          display: block;
          height: 100%;
          background: var(--bg-brand);
          border-radius: 8px;
        }
        .meter-row b {
          font-variant-numeric: tabular-nums;
        }
        .value-row {
          display: grid;
          grid-template-columns: minmax(0, 40%) minmax(0, 1fr);
          gap: 4px 16px;
          padding-bottom: 12px;
          border-bottom: 1px solid var(--border-subtle);
          font-size: 14px;
        }
        .value-row:last-child {
          border-bottom: 0;
          padding-bottom: 0;
        }
        .value-row span {
          color: var(--text-secondary);
        }
        .value-row b {
          overflow-wrap: anywhere;
        }
        .boiler {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .boiler .head {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .boiler p {
          color: var(--text-secondary);
          font-size: 14px;
        }

        /* ---------- Logo ---------- */
        .logo-tile {
          border-radius: var(--radius);
          border: 1px solid var(--border-subtle);
          overflow: hidden;
          background: var(--bg-surface);
          display: flex;
          flex-direction: column;
        }
        .logo-stage {
          aspect-ratio: 4/3;
          display: grid;
          place-items: center;
          padding: 28px;
          max-width: 100%;
        }
        .logo-stage svg,
        .logo-stage img {
          max-width: 100%;
          max-height: 100%;
        }
        .logo-stage img {
          max-height: 120px;
          object-fit: contain;
        }
        .clearspace img {
          display: block;
          max-width: 240px;
          max-height: 90px;
        }
        .side-brand .mark img {
          width: 34px;
          height: 34px;
          object-fit: contain;
          display: block;
        }
        .logo-meta {
          padding: 12px 14px;
          border-top: 1px solid var(--border-subtle);
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          font-size: 13px;
        }
        .logo-meta b {
          display: block;
        }
        .logo-meta small {
          color: var(--text-tertiary);
        }
        .misuse .logo-stage {
          position: relative;
        }
        .misuse .logo-stage::after {
          content: "";
          position: absolute;
          inset: 14px;
          background: linear-gradient(
            to top right,
            transparent calc(50% - 1px),
            var(--danger) calc(50% - 1px),
            var(--danger) calc(50% + 1px),
            transparent calc(50% + 1px)
          );
          opacity: 0.7;
          pointer-events: none;
        }
        .clearspace {
          position: relative;
          display: inline-block;
          padding: var(--cs);
          outline: 1px dashed var(--danger);
          outline-offset: 0;
        }
        .clearspace::before {
          content: "";
          position: absolute;
          inset: var(--cs);
          outline: 1px solid var(--border-default);
        }

        /* ---------- Color ---------- */
        .ramp {
          display: grid;
          grid-template-columns: repeat(11, minmax(0, 1fr));
          border-radius: var(--radius);
          overflow: hidden;
          border: 1px solid var(--border-subtle);
        }
        .ramp button {
          border: 0;
          padding: 0;
          cursor: pointer;
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          min-height: 88px;
          padding: 8px 6px;
          text-align: left;
          font-size: 11px;
          line-height: 1.3;
        }
        .ramp button b {
          font-size: 12px;
        }
        .ramp button.base {
          box-shadow: inset 0 -4px 0 currentColor;
        }
        .ramp-head {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          margin-bottom: 8px;
        }
        .ramp-head b {
          font-family: var(--font-display);
          font-size: 16px;
        }
        .ramp-wrap {
          overflow-x: auto;
        }
        .ramp-wrap .ramp {
          min-width: 620px;
        }
        .proportion {
          display: flex;
          height: 56px;
          border-radius: var(--radius);
          overflow: hidden;
          border: 1px solid var(--border-subtle);
        }
        .proportion div {
          display: flex;
          align-items: flex-end;
          padding: 8px 10px;
          font-size: 12px;
          font-weight: 600;
        }
        table {
          border-collapse: collapse;
          width: 100%;
          font-size: 13.5px;
        }
        th,
        td {
          text-align: left;
          padding: 10px 12px;
          border-bottom: 1px solid var(--border-subtle);
          vertical-align: middle;
        }
        th {
          font-size: 11.5px;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: var(--text-tertiary);
          font-weight: 600;
        }
        .tbl {
          overflow-x: auto;
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
          background: var(--bg-surface);
        }
        .tbl tr:last-child td {
          border-bottom: 0;
        }
        .sw {
          display: inline-block;
          width: 18px;
          height: 18px;
          border-radius: 5px;
          border: 1px solid var(--border-subtle);
          vertical-align: middle;
          margin-right: 8px;
        }
        .num {
          font-variant-numeric: tabular-nums;
        }
        .pair {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 40px;
          height: 28px;
          border-radius: 6px;
          font-weight: 600;
          font-size: 13px;
          border: 1px solid var(--border-subtle);
        }

        /* ---------- Type ---------- */
        .type-row {
          display: grid;
          grid-template-columns: 170px minmax(0, 1fr);
          gap: 20px;
          align-items: baseline;
          padding-block: 14px;
          border-bottom: 1px solid var(--border-subtle);
        }
        .type-row:last-child {
          border-bottom: 0;
        }
        .type-row .spec {
          font-size: 12px;
          color: var(--text-tertiary);
          line-height: 1.5;
        }
        .type-row .spec code {
          color: var(--text-brand);
          font-size: 12px;
        }
        .type-row .sample {
          overflow-wrap: anywhere;
        }
        .family {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .family .big {
          font-size: 64px;
          line-height: 1;
        }
        .family small {
          color: var(--text-tertiary);
        }

        /* ---------- Spacing ---------- */
        .space-row {
          display: grid;
          grid-template-columns: 80px 48px minmax(0, 1fr);
          gap: 12px;
          align-items: center;
          font-size: 13px;
          padding-block: 4px;
        }
        .space-row i {
          display: block;
          height: 14px;
          background: var(--bg-brand);
          border-radius: 3px;
          max-width: 100%;
        }
        .radius-demo {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
        }
        .radius-demo div {
          width: 84px;
          height: 84px;
          background: var(--bg-brand-subtle);
          border: 2px solid var(--bg-brand);
          display: grid;
          place-items: end center;
          padding-bottom: 6px;
          font-size: 11px;
          color: var(--text-brand);
          font-weight: 600;
        }
        .grid-demo {
          display: grid;
          grid-template-columns: repeat(12, 1fr);
          gap: 8px;
          height: 80px;
        }
        .grid-demo i {
          background: color-mix(in srgb, var(--danger) 14%, transparent);
          border-inline: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        }

        /* ---------- Components ---------- */
        .comp {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .comp-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }
        .comp-stage {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          align-items: center;
          padding: 22px;
          background: var(--bg-canvas);
          border-radius: 8px;
          border: 1px dashed var(--border-default);
        }
        .comp pre {
          margin: 0;
          background: var(--bg-muted);
          border-radius: 8px;
          padding: 10px 12px;
          overflow-x: auto;
          font-size: 12px;
        }
        .field {
          display: flex;
          flex-direction: column;
          gap: 6px;
          width: 100%;
          max-width: 280px;
        }
        .field label {
          font-size: 13px;
          font-weight: 500;
        }
        .field input {
          font: inherit;
          font-size: 14px;
          padding: 9px 12px;
          border-radius: var(--radius);
          border: 1px solid var(--border-default);
          background: var(--bg-surface);
          color: var(--text-primary);
        }
        .field input:focus {
          outline: none;
          border-color: var(--border-focus);
          box-shadow: 0 0 0 3px var(--bg-brand-subtle);
        }
        .field.err input {
          border-color: var(--danger);
        }
        .field small {
          font-size: 12px;
          color: var(--text-tertiary);
        }
        .field.err small {
          color: var(--danger);
        }
        .alert {
          display: flex;
          gap: 10px;
          padding: 12px 14px;
          border-radius: var(--radius);
          border: 1px solid;
          font-size: 14px;
          width: 100%;
        }
        .alert b {
          display: block;
        }
        .demo-card {
          background: var(--bg-surface);
          border: 1px solid var(--border-subtle);
          border-radius: var(--radius);
          overflow: hidden;
          max-width: 260px;
          box-shadow: var(--shadow);
        }
        .demo-card .img {
          height: 110px;
          background: linear-gradient(
            135deg,
            var(--bg-brand),
            color-mix(in srgb, var(--bg-brand) 60%, var(--accent))
          );
        }
        .demo-card .body {
          padding: 14px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .demo-card p {
          font-size: 13px;
          color: var(--text-secondary);
        }
        .avatar {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          display: grid;
          place-items: center;
          font-weight: 600;
          background: var(--bg-brand-subtle);
          color: var(--text-brand);
          font-size: 14px;
        }

        /* ---------- Templates ---------- */
        .tpl {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .tpl-art {
          aspect-ratio: 4/5;
          border-radius: var(--radius);
          overflow: hidden;
          position: relative;
          display: flex;
          flex-direction: column;
          padding: 8%;
          border: 1px solid var(--border-subtle);
          max-width: 100%;
          container-type: inline-size;
        }
        .tpl-art .logo-sm {
          height: 7cqw;
          min-height: 12px;
        }
        .tpl-art .logo-sm img,
        .tpl-art .logo-sm svg {
          height: 100%;
          width: auto;
          display: block;
        }
        .tpl-art h4 {
          font-size: 11cqw;
          line-height: 1.02;
          letter-spacing: -0.03em;
        }
        .tpl-art .big {
          font-family: var(--font-display);
          font-size: 30cqw;
          line-height: 0.9;
          letter-spacing: -0.05em;
          font-weight: 700;
        }
        .tpl-art p {
          font-size: 4.6cqw;
          opacity: 0.85;
        }
        .tpl-foot {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }
        .tpl-foot b {
          font-size: 14px;
          display: block;
        }
        .tpl-foot small {
          color: var(--text-tertiary);
          font-size: 12px;
        }
        .tpl-links {
          display: flex;
          gap: 6px;
        }
        .filter {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
        }
        .filter button {
          border: 1px solid var(--border-default);
          background: var(--bg-surface);
          border-radius: 999px;
          padding: 5px 12px;
          font-size: 13px;
          cursor: pointer;
          color: var(--text-secondary);
        }
        .filter button[aria-pressed="true"] {
          background: var(--bg-inverse);
          color: var(--text-inverse);
          border-color: var(--bg-inverse);
        }

        /* ---------- Downloads / Handoff ---------- */
        .dl {
          display: flex;
          flex-direction: column;
          gap: 10px;
          justify-content: flex-start;
        }
        .dl > .btn:last-child {
          margin-top: auto;
          align-self: flex-start;
        }
        .dl .top {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          gap: 8px;
        }
        .dl code {
          color: var(--text-tertiary);
          font-size: 12px;
        }
        .dl p {
          color: var(--text-secondary);
          font-size: 13.5px;
        }
        .fmt {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
        }
        .fmt span {
          font-family: var(--font-mono);
          font-size: 10.5px;
          padding: 2px 6px;
          border-radius: 4px;
          background: var(--bg-muted);
          color: var(--text-secondary);
        }
        .support {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .meter {
          height: 8px;
          background: var(--bg-muted);
          border-radius: 8px;
          overflow: hidden;
        }
        .meter i {
          display: block;
          height: 100%;
          background: var(--bg-brand);
        }
        .log {
          display: flex;
          flex-direction: column;
        }
        .log div {
          display: grid;
          grid-template-columns: 70px 100px 1fr;
          gap: 12px;
          padding: 10px 0;
          border-bottom: 1px solid var(--border-subtle);
          font-size: 14px;
        }
        .log div:last-child {
          border-bottom: 0;
        }
        .log span {
          color: var(--text-tertiary);
        }
        .contact {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .contact small {
          color: var(--text-tertiary);
          display: block;
          font-size: 12.5px;
        }
        .link-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 10px;
          padding: 12px 0;
          border-bottom: 1px solid var(--border-subtle);
        }
        .link-row:last-child {
          border-bottom: 0;
        }
        .link-row small {
          color: var(--text-tertiary);
          display: block;
          font-size: 12.5px;
        }

        /* ---------- Links, downloads, 3D ---------- */
        a.fact {
          color: inherit;
          text-decoration: none;
          transition: border-color 0.15s;
        }
        a.fact:hover {
          border-color: var(--border-strong);
        }
        a.fact .go {
          color: var(--text-brand);
          font-size: 13px;
          font-weight: 600;
          white-space: nowrap;
        }
        .hero.solo {
          grid-template-columns: 1fr;
        }
        .hero-main.on-light .hero-meta .pill {
          background: color-mix(in srgb, currentColor 10%, transparent);
        }
        .fam-actions {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          margin-top: auto;
          padding-top: 6px;
        }
        .family.viewing {
          border-color: var(--border-focus);
          box-shadow: 0 0 0 1px var(--border-focus);
        }
        .type-view-bar {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
          font-size: 13px;
          color: var(--text-secondary);
          margin-bottom: 10px;
        }
        .dl-menu {
          position: relative;
        }
        .dl-menu summary {
          list-style: none;
        }
        .dl-menu summary::-webkit-details-marker {
          display: none;
        }
        .dl-pop {
          position: absolute;
          z-index: 4;
          top: calc(100% + 6px);
          left: 0;
          min-width: 220px;
          background: var(--bg-surface);
          border: 1px solid var(--border-default);
          border-radius: var(--radius);

        const STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
        const hex2rgb = (h) => {
          h = h.replace("#", "");
          if (h.length === 3) h = [...h].map((c) => c + c).join("");
          return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));

        const rgb2hex = (a) =>
          "#" +
          a
            .map((v) =>
              Math.round(Math.max(0, Math.min(255, v)))
                .toString(16)
                .padStart(2, "0"),
            )
            .join("")
            .toUpperCase();
        const mix = (a, b, t) => rgb2hex(hex2rgb(a).map((v, i) => v + (hex2rgb(b)[i] - v) * t));

          const tint = [0.92, 0.84, 0.68, 0.5, 0.28],
            shade = [0.14, 0.3, 0.45, 0.6, 0.72],
            out = {};
          STEPS.forEach((s, i) => {

              i < 5
                ? mix(base, "#FFFFFF", tint[i])
                : i === 5
                  ? base.toUpperCase()

          return out;

            .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);

          const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m);

        /* ---------- Logo generator (placeholder until real SVGs are dropped in) ---------- */
        function logoSVG(kind, fg, mark, bgAccent) {
          const n = esc(BRAND.client.name),
            fd = esc(F.display.family);
          const sym = (x, y, s) =>
            `<g transform="translate(${x} ${y}) scale(${s / 100})"><rect width="100" height="100" rx="${Math.min(30, BRAND.radius * 2.4)}" fill="${mark}"/><circle cx="50" cy="50" r="24" fill="none" stroke="${bgAccent}" stroke-width="11"/><circle cx="50" cy="50" r="8" fill="${bgAccent}"/></g>`;
          if (kind === "symbol")
            return `<svg viewBox="0 0 100 100" width="96" height="96" role="img" aria-label="${n} symbol">${sym(0, 0, 100)}</svg>`;
          // Widen the viewBox for long names so the placeholder scales down instead of being cut off.
          const textW = (size) => String(BRAND.client.name || "").length * size * 0.56;
          if (kind === "wordmark") {
            const w = Math.max(300, Math.ceil(textW(54) + 20));
            return `<svg viewBox="0 0 ${w} 80" width="240" role="img" aria-label="${n} wordmark"><text x="${w / 2}" y="56" text-anchor="middle" font-family="${fd}" font-weight="700" font-size="54" letter-spacing="-2" fill="${fg}">${n.toLowerCase()}</text></svg>`;
          }
          if (kind === "stacked") {
            const w = Math.max(220, Math.ceil(textW(48) + 20));
            return `<svg viewBox="0 0 ${w} 190" width="170" role="img" aria-label="${n} stacked logo">${sym((w - 80) / 2, 0, 80)}<text x="${w / 2}" y="160" text-anchor="middle" font-family="${fd}" font-weight="700" font-size="48" letter-spacing="-2" fill="${fg}">${n.toLowerCase()}</text></svg>`;
          }
          const w = Math.max(330, Math.ceil(100 + textW(54) + 10));
          return `<svg viewBox="0 0 ${w} 90" width="250" role="img" aria-label="${n} primary logo">${sym(0, 5, 80)}<text x="100" y="64" font-family="${fd}" font-weight="700" font-size="54" letter-spacing="-2" fill="${fg}">${n.toLowerCase()}</text></svg>`;
        }
        // variant: 'full' (default), 'light' (for dark/brand backgrounds), 'dark' (one-color dark)
        const logoSrc = (l, variant) =>
          variant === "light"
            ? l.srcLight || l.src

              ? l.srcDark || l.src
              : l.src || l.srcDark || l.srcLight;
        const logoFor = (l, fg, mark, acc, variant = "full") => {

          return l && l.svg
            ? l.svg

        /* ---------- Palette downloads: Adobe swatches, swatch sheet, CSS, JSON ---------- */
        function aseBlob(swatches) {
          const blocks = swatches.map(([name, hex]) => {
            const nm = name + "\0",
              len = 2 + nm.length * 2 + 4 + 12 + 2,
              v = new DataView(new ArrayBuffer(6 + len));
            let o = 0;
            v.setUint16(o, 1);
            v.setUint32((o += 2), len);
            v.setUint16((o += 4), nm.length);
            o += 2;
            for (let i = 0; i < nm.length; i++, o += 2) v.setUint16(o, nm.charCodeAt(i));
            for (let i = 0; i < 4; i++, o++) v.setUint8(o, "RGB ".charCodeAt(i));
            hex2rgb(hex).forEach((c) => {
              v.setFloat32(o, c / 255);
              o += 4;
            });
            v.setUint16(o, 2);
            return v.buffer;
          });
          const h = new DataView(new ArrayBuffer(12));
          for (let i = 0; i < 4; i++) h.setUint8(i, "ASEF".charCodeAt(i));
          h.setUint16(4, 1);
          h.setUint16(6, 0);
          h.setUint32(8, blocks.length);
          return new Blob([h.buffer, ...blocks], { type: "application/octet-stream" });
        }
        let _palette = null;
        function paletteFiles() {
          if (_palette) return _palette;
          const base = fileBase().replace("%", "Color-Palette"),

          const svg =
            `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Arial, sans-serif"><rect width="100%" height="100%" fill="#FFFFFF"/>` +
            rows
              .map(
                ([n, r], i) =>
                  `<text x="20" y="${i * 90 + 60}" font-size="15" font-weight="700" fill="#14181D">${n}</text>` +
                  STEPS.map((s, j) => {
                    const x = 140 + j * 80,
                      y = i * 90 + 20,
                      fg = contrast(r[s], "#FFFFFF") >= 4.5 ? "#FFFFFF" : "#111418";
                    return `<rect x="${x}" y="${y}" width="80" height="70" fill="${r[s]}"/><text x="${x + 6}" y="${y + 48}" font-size="11" font-weight="700" fill="${fg}">${s}</text><text x="${x + 6}" y="${y + 62}" font-size="10" fill="${fg}">${r[s]}</text>`;
                  }).join(""),
              )
              .join("") +
            `</svg>`;
          const css = `/* ${C.fullName} color palette ${C.version} */\n:root {\n${rows.flatMap(([n, r]) => STEPS.map((s) => `  --${n}-${s}: ${r[s]};`)).join("\n")}\n}\n`;
          const json = JSON.stringify(
            Object.fromEntries(
              rows.map(([n, r]) => [

                Object.fromEntries(STEPS.map((s) => [s, { hex: r[s], rgb: hex2rgb(r[s]).join(", ") }])),
              ]),
            ),
            null,
            2,
          );
          _palette = [
            genFile(base + ".ase", aseBlob(sw), "application/octet-stream", "Adobe swatches (.ase)"),
            genFile(base + ".svg", svg, "image/svg+xml", "Swatch sheet (.svg)"),
            genFile(base + ".css", css, "text/css", "CSS variables (.css)"),
            genFile(base + ".json", json, "application/json", "HEX + RGB (.json)"),
          ].filter(Boolean);
          return _palette;

        /* ---------- Hero background (set per client in the builder) ---------- */
        function heroLook() {
          const H = Object.assign(
            { bg: "brand", ring: true, text: "auto", overlay: 35, angle: 135 },
            BRAND.hero || {},
          );
          const ok = (h) => /^#[0-9a-f]{6}$/i.test(String(h || ""));
          const dark = P.neutral[950];
          const pickText = (tone) =>
            H.text === "light"
              ? "#FFFFFF"
              : H.text === "dark"
                ? dark
                : contrast(tone, "#FFFFFF") >= contrast(tone, dark)
                  ? "#FFFFFF"
                  : dark;
          let bg = "",
            tone = null;
          if (H.bg === "accent") tone = bg = P.accent[500];
          else if (H.bg === "dark") tone = bg = dark;
          else if (H.bg === "light") tone = bg = P.neutral[50];
          else if (H.bg === "custom" && ok(H.color)) tone = bg = H.color;
          else if (H.bg === "gradient" && ok(H.color) && ok(H.color2)) {
            bg = `linear-gradient(${Number(H.angle) || 0}deg, ${H.color}, ${H.color2})`;
            // Text sits across both ends: pick the color whose worse end still reads best.
            const worst = (fg) => Math.min(contrast(H.color, fg), contrast(H.color2, fg));
            tone = worst("#FFFFFF") >= worst(dark) ? P.neutral[950] : "#FFFFFF";
          } else if (H.bg === "image" && H.image) {
            const a = Math.max(0, Math.min(0.9, (Number(H.overlay) || 0) / 100));
            bg = `linear-gradient(rgba(0,0,0,${a}), rgba(0,0,0,${a})), url("${H.image}") center / cover no-repeat, ${dark}`;
            tone = mix(dark, "#FFFFFF", 0.5 - a * 0.5);
          }
          const fg = tone ? pickText(tone) : H.text === "auto" ? "" : pickText(P.brand[600]);
          const style = (bg ? `background:${bg};` : "") + (fg ? `color:${fg};` : "");
