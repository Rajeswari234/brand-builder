            .map((p) => {
              const bg = p.token === "neutral" ? P.neutral[100] : P[p.token][500];
              const fg = contrast(bg, "#FFFFFF") >= 4.5 ? "#FFFFFF" : "#111418";
              return `<div style="flex:${p.pct};background:${bg};color:${fg}">${p.pct}% ${esc(p.label)}</div>`;
            })
            .join("");
          const pairs = [
            ["text-primary", "bg-surface"],
            ["text-secondary", "bg-surface"],
            ["text-tertiary", "bg-surface"],
            ["text-on-brand", "bg-brand"],
            ["text-brand", "bg-brand-subtle"],
            ["text-inverse", "bg-inverse"],
            ["accent", "bg-surface"],
          ];
          const row = (mode) =>
            pairs
              .map(([f, b]) => {
                const fc = SEM[mode][f],
                  bc = SEM[mode][b],
                  r = contrast(fc, bc),
                  [g, cls] = grade(r);
                return `<tr><td><span class="pair" style="background:${bc};color:${fc}">Aa</span></td><td><code>${f}</code> on <code>${b}</code></td><td class="num">${r.toFixed(2)}:1</td><td><span class="pill ${cls}">${g}</span></td></tr>`;
              })
              .join("");
          const semRows = Object.keys(SEM.light)
            .map(
              (k) => `<tr><td><code>--color-${k}</code></td>
     <td><span class="sw" style="background:${SEM.light[k]}"></span><span class="mono">${SEM.light[k]}</span></td>
     <td><span class="sw" style="background:${SEM.dark[k]}"></span><span class="mono">${SEM.dark[k]}</span></td>
     <td><button class="copy" data-copy="var(--color-${k})">Copy var</button></td></tr>`,
            )
            .join("");
          const rgb = (h) => hex2rgb(h).join(", ");
          // Each block is its own element so the studio can leave any of them out.
          const blocks = [
            ["color.proportion", `<h3>Proportion</h3><div class="proportion">${prop}</div>`],
            [
              "color.core",
              `<h3>Core colors</h3>
  <div class="tbl"><table><tr><th>Color</th><th>HEX</th><th>RGB</th><th>Token</th></tr>
    ${["brand", "accent", "neutral"].map((k) => `<tr><td><span class="sw" style="background:${BRAND.colors[k]}"></span><b style="text-transform:capitalize">${k}</b></td><td class="mono num">${BRAND.colors[k].toUpperCase()} <button class="copy" data-copy="${BRAND.colors[k].toUpperCase()}">Copy</button></td><td class="mono num">${rgb(BRAND.colors[k])}</td><td><code>${k}/500</code></td></tr>`).join("")}
  </table></div>`,
            ],
            [
              "color.palette",
              `<h3>Download the palette</h3><div class="dl-row">${paletteFiles()
                .map((f) => dlBtn(f, f.label))
                .join("")}</div>`,
            ],
            [
              "color.ramps",
              `<h3>Primitive ramps <span class="pill" style="vertical-align:middle">click a swatch to copy</span></h3>
  <div style="display:flex;flex-direction:column;gap:20px">${ramps}</div>`,
            ],
            [
              "color.semantic",
              `<h3>Semantic tokens</h3>
  <div class="tbl"><table><tr><th>Token</th><th>Light</th><th>Dark</th><th></th></tr>${semRows}</table></div>`,
            ],
            [
              "color.contrast",
              `<h3>Contrast</h3>
  <div class="grid g2"><div class="tbl"><table><tr><th colspan="4">Light mode</th></tr>${row("light")}</table></div><div class="tbl"><table><tr><th colspan="4">Dark mode</th></tr>${row("dark")}</table></div></div>`,
            ],
          ].filter(([id]) => part(id));
          return `<section id="color">${head("Tokens · Tier 1 → 2", "Color", "Primitives are the raw palette. Semantic tokens say what a color does, and they switch automatically between light and dark. Designers and developers use the semantic layer.")}
  ${blocks.map(([, h], i) => (i ? h.replace("<h3>", '<h3 class="sub">') : h)).join("\n")}
  </section>`;
        }

        /* Type: each family has Download and View. View shows the whole type scale in that family;
   clicking it again (or Reset) goes back to the scale as specified. */
        const ROLE_NAME = { display: "Display", body: "Body", mono: "Mono" };
        let typeView = null;
        function fontDl(k) {
          const f = F[k],
            files = f.files || [];
          if (files.length === 1) return dlBtn(files[0], "Download");
          if (files.length > 1)
            return `<details class="dl-menu"><summary class="btn" data-variant="secondary" data-size="sm">Download ▾</summary><div class="dl-pop">${files.map((x) => `<a href="${esc(x.src)}" download="${esc(x.name)}">${esc(x.name)}</a>`).join("")}</div></details>`;
          if (f.url) return dlBtn({ src: f.url, external: true }, "Download");
          return `<span class="btn" data-variant="secondary" data-size="sm" aria-disabled="true">Download · pending</span>`;
        }
        function familyCard(k) {
          const f = F[k],
            on = typeView === k;
          return `<div class="card family${on ? " viewing" : ""}" data-fam="${k}"><div class="eyebrow">${k}</div>
    <div class="big" style="font-family:${fam(f)};font-weight:${f.weights[f.weights.length - 1]}">Aa</div>
    <b style="font-family:${fam(f)};font-size:18px">${esc(f.family)}</b><small>Weights ${f.weights.join(" · ")} · ${esc(f.source)}</small>
    <small>Fallback: ${esc(f.fallback)}</small>
    <div class="fam-actions">${fontDl(k)}<button type="button" class="btn" data-variant="${on ? "primary" : "secondary"}" data-size="sm" data-view="${k}" aria-pressed="${on}" title="Show the type scale in ${esc(f.family)}">${on ? "Viewing" : "View"}</button></div></div>`;
        }
        function typeScaleRows() {
          return BRAND.typeScale
            .map((t) => {
              const role = typeView || t.font;
              return `<div class="type-row"><div class="spec"><code>${t.token}</code><br>${t.size}/${t.lh} · mobile ${t.m}<br>${t.w} · ${t.track}% · ${t.use}${typeView && typeView !== t.font ? `<br><span style="color:var(--text-brand)">shown in ${esc(F[typeView].family)}</span>` : ""}</div>
    <div class="sample" style="font-family:var(--font-${role});font-size:clamp(${t.m}px,${(t.size / 12).toFixed(2)}vw,${t.size}px);line-height:${(t.lh / t.size).toFixed(3)};font-weight:${t.w};letter-spacing:${t.track / 100}em">${t.size >= 26 ? esc(C.tagline) : esc(D.sentence)}</div></div>`;
            })
            .join("");
        }
        const typeViewBar = () =>
          typeView
            ? `<span class="pill brand">Showing every style in ${esc(F[typeView].family)} (${ROLE_NAME[typeView]})</span><button type="button" class="copy" data-view-reset>Reset to spec</button>`
            : `<span>Each style in its assigned family. Press <b>View</b> on a font above to see the whole scale in it.</span>`;
        function refreshTypeView() {
          const g = $("#type-fams");
          if (g) g.innerHTML = ["display", "body", "mono"].map(familyCard).join("");
          if ($("#type-view-bar")) $("#type-view-bar").innerHTML = typeViewBar();
          if ($("#type-scale")) $("#type-scale").innerHTML = typeScaleRows();
        }
        function type() {
          return `<section id="type">${head("Tokens · Type", "Typography", "Two families do all the work. Each style is named for its job, so pick by role and the size follows.")}
  <div class="grid g3" id="type-fams">${["display", "body", "mono"].map(familyCard).join("")}</div>
  ${part("type.scale") ? `<h3 class="sub">Type scale</h3><div class="type-view-bar" id="type-view-bar" aria-live="polite">${typeViewBar()}</div><div class="card" style="padding-block:6px" id="type-scale">${typeScaleRows()}</div>` : ""}
  ${
    part("type.fallback")
      ? `<h3 class="sub">When the brand font is not available</h3>
  <div class="tbl"><table><tr><th>Where</th><th>Headings</th><th>Body</th></tr>
  <tr><td>Google Docs / Slides</td><td>${esc(F.display.family)} (built in)</td><td>${esc(F.body.family)} (built in)</td></tr>
  <tr><td>Word / PowerPoint</td><td>Arial Bold</td><td>Arial</td></tr>
  <tr><td>Email (HTML)</td><td colspan="2">Arial, Helvetica, sans-serif</td></tr></table></div>`
      : ""
  }</section>`;
        }

        function space() {
          const sc = [
            [0, 0],
            [1, 4],
            [2, 8],
            [3, 12],
            [4, 16],
            [5, 20],
            [6, 24],
            [8, 32],
            [10, 40],
            [12, 48],
            [16, 64],
            [20, 80],
            [24, 96],
            [32, 128],
          ];
          const radii = [
            ["none", 0],
            ["sm", 4],
            ["md", 8],
            ["brand", BRAND.radius],
            ["lg", 16],
            ["xl", 24],
            ["full", 999],
          ];
          return `<section id="space">${head("Tokens · Layout", "Spacing & layout", "Everything sits on a 4px base. The token number is the multiplier, so space/6 is 24px.")}
  <div class="grid g2">
    ${part("space.scale") ? `<div class="card">${sc.map(([n, px]) => `<div class="space-row"><code>space/${n}</code><span class="num">${px}px</span><i style="width:${(px / 128) * 100}%"></i></div>`).join("")}</div>` : ""}
    <div style="display:flex;flex-direction:column;gap:16px">
      ${part("space.radius") ? `<div class="card"><h3>Radius</h3><div class="radius-demo">${radii.map(([n, r]) => `<div style="border-radius:${Math.min(r, 42)}px">${n} ${r === 999 ? "" : r}</div>`).join("")}</div></div>` : ""}
      ${
        part("space.grid")
          ? `<div class="card"><h3>Grid</h3><div class="grid-demo">${"<i></i>".repeat(12)}</div>
      <div class="tbl" style="margin-top:14px"><table><tr><th>Breakpoint</th><th>Cols</th><th>Gutter</th><th>Margin</th></tr>
      <tr><td>Desktop ≥1280</td><td class="num">12</td><td class="num">24</td><td class="num">80</td></tr>
      <tr><td>Tablet ≥768</td><td class="num">8</td><td class="num">24</td><td class="num">40</td></tr>
      <tr><td>Mobile</td><td class="num">4</td><td class="num">16</td><td class="num">16</td></tr></table></div></div>`
          : ""
      }
      ${
        part("space.rules")
          ? `<div class="card"><h3>Rules</h3><ul style="margin:0;padding-left:18px;color:var(--text-secondary);display:flex;flex-direction:column;gap:6px">
        <li>Inside a component: space/1 to space/4.</li><li>Between components: space/4 to space/8.</li><li>Between sections: space/12 to space/32.</li><li>Space inside a group is always smaller than space between groups.</li></ul></div>`
          : ""
      }
    </div>
  </div></section>`;
        }

        function components() {
          const a = D.alerts;
          const comp = (name, status, stage, code) =>
            `<div class="card comp"><div class="comp-head"><h3 style="margin:0">${name}</h3><span class="pill ${status === "Ready" ? "ok" : "warn"}">${status}</span></div><div class="comp-stage">${stage}</div><pre><code>${esc(code)}</code></pre></div>`;
          const status = (k, t, d) =>
            `<div class="alert" style="background:color-mix(in srgb,var(--${k}) 10%,var(--bg-surface));border-color:color-mix(in srgb,var(--${k}) 35%,transparent)"><span style="color:var(--${k});font-weight:700">●</span><div><b>${t}</b><span style="color:var(--text-secondary)">${d}</span></div></div>`;
          return `<section id="components">${head("Tier 3", "Components", "Live components built from the tokens above. Figma variant names match the code props exactly.")}
  <div class="grid g2">
  ${comp(
    "Button",
    "Ready",
    `<button class="btn" data-variant="primary" data-size="md">${esc(D.primaryCta)}</button><button class="btn" data-variant="secondary" data-size="md">${esc(D.secondaryCta)}</button><button class="btn" data-variant="ghost" data-size="md">Learn more</button><button class="btn" data-variant="destructive" data-size="sm">Delete</button><button class="btn" data-variant="primary" data-size="md" disabled>Disabled</button>`,
    `<Button variant="primary" size="md">${D.primaryCta}</Button>\n// variant: primary | secondary | ghost | destructive\n// size: sm | md | lg`,
  )}
  ${comp(
    "Input",
    "Ready",
    `<div class="field"><label for="c-email">Email</label><input id="c-email" type="email" placeholder="you@example.com"><small>We'll only use this to reply.</small></div>
     <div class="field err"><label for="c-phone">Phone</label><input id="c-phone" value="555-01"><small>Enter a full phone number.</small></div>`,
    `<Input label="Email" type="email" hint="We'll only use this to reply." />\n<Input label="Phone" error="Enter a full phone number." />`,
  )}
  ${comp(
    "Card",
    "Ready",
    `<div class="demo-card"><div class="img"></div><div class="body"><span class="pill brand" style="align-self:flex-start">${esc(D.cardTag)}</span><b>${esc(D.cardTitle)}</b><p>${esc(D.cardText)}</p></div></div>`,
    `<Card variant="elevated" tag="${D.cardTag}" title="${D.cardTitle}">…</Card>`,
  )}
  ${comp(
    "Badge & Avatar",
    "Ready",
    `<span class="pill">Neutral</span><span class="pill brand">Brand</span><span class="pill ok">Active</span><span class="pill warn">Pending</span><span class="pill bad">Expired</span><span class="avatar">AR</span><span class="avatar" style="background:var(--accent);color:#111418">SO</span>`,
    `<Badge tone="success">Active</Badge>\n<Avatar initials="AR" />`,
  )}
  ${comp(
    "Alert",
    "Ready",
    status("success", esc(a.success[0]) + " ", esc(a.success[1])) +
      status("warning", esc(a.warning[0]) + " ", esc(a.warning[1])) +
      status("danger", esc(a.danger[0]) + " ", esc(a.danger[1])),
    `<Alert tone="success" title="${a.success[0]}">${a.success[1]}</Alert>`,
  )}
  </div></section>`;
        }

        function tplArt(t) {
          const logoSm = (h) => {
            const lt = h === "#FFFFFF";
            const l = logoByKind("primary");
            const src = l && logoSrc(l, lt ? "light" : "full");
            return `<div class="logo-sm">${src ? `<img src="${esc(src)}" alt="">` : logoSVG("primary", h, lt ? "#FFFFFF" : P.brand[600], lt ? P.brand[600] : "#FFFFFF").replace('width="250"', 'height="100%"')}</div>`;
          };
          if (t.image)
            return `<div class="tpl-art" style="padding:0;${t.archetype === "Event" ? "aspect-ratio:9/16" : ""}"><img src="${esc(t.image)}" alt="${esc(t.name)} preview" style="width:100%;height:100%;object-fit:cover"></div>`;
          const hl = esc(t.headline || ""),
            sb = esc(t.sub || "");
          switch (t.archetype) {
            case "Statement":
              return `<div class="tpl-art" style="background:${P.brand[600]};color:#FFFFFF">${logoSm("#FFFFFF")}<h4 style="margin-top:auto">${hl || esc(C.tagline)}</h4>${sb ? `<p style="margin-top:4%">${sb}</p>` : ""}</div>`;
            case "Showcase":
              return `<div class="tpl-art" style="background:${P.neutral[50]};color:${P.neutral[950]};padding:0"><div style="flex:1;background:linear-gradient(160deg,${P.accent[300]},${P.brand[500]})"></div><div style="padding:8%;display:flex;flex-direction:column;gap:4%">${logoSm(P.neutral[950])}<h4 style="font-size:8cqw">${hl}</h4><p>${sb}</p></div></div>`;
            case "Data":
              return `<div class="tpl-art" style="background:${P.accent[400]};color:${P.neutral[950]}">${logoSm(P.neutral[950])}<div class="big" style="margin-top:auto">${hl}</div><p>${sb}</p></div>`;
            case "Carousel":
              return `<div class="tpl-art" style="background:${P.neutral[950]};color:#FFFFFF"><p style="letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:${P.accent[400]}">${sb}</p><h4 style="margin-top:auto">${hl}</h4><p style="margin-top:4%">Swipe →</p></div>`;
            case "Event":
              return `<div class="tpl-art" style="background:${P.brand[50]};color:${P.brand[900]};aspect-ratio:9/16">${logoSm(P.brand[900])}<p style="margin-top:auto;font-weight:600;letter-spacing:.1em;text-transform:uppercase">${sb}</p><h4>${hl}</h4><span style="margin-top:6%;align-self:flex-start;background:${P.brand[600]};color:#fff;border-radius:999px;padding:3% 7%;font-size:4.4cqw;font-weight:600">${esc(D.primaryCta)}</span></div>`;
          }
          return "";
        }
        let tplFilter = "All";
        function templatesInner() {
          const list = BRAND.templates.filter((t) => tplFilter === "All" || t.channel === tplFilter);
          return list
            .map(
              (
                t,
              ) => `<div class="tpl" data-card-list="templates" data-card-index="${BRAND.templates.indexOf(t)}">${tplArt(t)}<div class="tpl-foot"><div><b>${esc(t.name)}</b><small>${esc(t.channel)} · ${esc(t.size)}</small></div></div>
    <div class="tpl-links">${linkBtn(t.canva, "Canva", "primary")}${part("handoff.figma") ? linkBtn(t.figma, "Figma") : ""}${t.image ? dlBtn({ src: t.image, name: t.imageName }, "Download") : ""}</div></div>`,
            )
            .join("");
        }
        function templates() {
          const chans = ["All", ...new Set(BRAND.templates.map((t) => t.channel))];
          if (!part("templates.filter")) tplFilter = "All";
          return `<section id="templates">${head("Marketing system", "Templates", "Each template locks the logo, colors and grid. Edit only the layers marked ✏️ Edit. Headlines stay under 40 characters.")}
  ${part("templates.filter") ? `<div class="filter" id="tpl-filter" style="margin-bottom:18px">${chans.map((c) => `<button type="button" aria-pressed="${c === tplFilter}" data-f="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
  <div class="grid g3" id="tpl-grid">${templatesInner()}</div></section>`;
        }

        /* ---------- 3D assets: one folder (zipped) plus four rendered views per asset ---------- */
        function threed() {
          const T = BRAND.threeD || { items: [] },
            fo = T.folder;
          const folder = fo
            ? `<div class="card m3d-folder"><div><div class="eyebrow" style="margin:0">3D asset folder</div><h3 style="margin:4px 0 2px">${esc(fo.label || "3D assets")}</h3>
      <p style="color:var(--text-secondary);font-size:14px">${fo.count ? `${fo.count} ${fo.count === 1 ? "file" : "files"} · ` : ""}${fmtSize(fo.size)}</p>
      ${(fo.formats || []).length ? `<div class="fmt" style="margin-top:8px">${fo.formats.map((x) => `<span>${esc(x)}</span>`).join("")}</div>` : ""}</div>
      ${dlBtn(fo, "Download folder (.zip)", "primary")}</div>`
            : `<div class="card"><p style="color:var(--text-secondary)">The 3D asset folder is on its way.</p></div>`;
          const cards = (T.items || [])
            .map(
              (m) => `<div class="card"><h3 style="margin:0">${esc(m.name)}</h3>${m.desc ? `<p style="color:var(--text-secondary);font-size:14px;margin-top:4px">${esc(m.desc)}</p>` : ""}
    <div class="views">${m.views
      .map(
        (v) =>
          `<figure class="view">${v.src ? `<img src="${esc(v.src)}" alt="${esc(m.name)}, ${esc(v.label)} view" loading="lazy">` : `<div class="view-ph">${esc(v.label)} view<br>coming soon</div>`}<figcaption><span>${esc(v.label)}</span>${dlBtn(v, "Download")}</figcaption></figure>`,
      )
      .join("")}</div></div>`,
            )
            .join("");
          return `<section id="threed">${head("Add-on", "3D assets", "Download the complete 3D folder, or grab any rendered view as a full-resolution image.")}
  ${folder}${cards ? `<div class="grid" style="margin-top:16px">${cards}</div>` : ""}</section>`;
        }

        /* ---------- Downloads: files the studio attached, plus files made from this brand ---------- */
        function autoFiles(kind) {
          const T = BRAND.threeD || { items: [] };
          if (kind === "logo")
            return BRAND.logos.flatMap((l) => (l.files || []).map((f) => ({ ...f, label: `${l.name} · ${f.label}` })));
          if (kind === "color") return paletteFiles();
          if (kind === "type") {
            const seen = new Set();
            return ["display", "body", "mono"].flatMap((k) => {
              const f = F[k];
              if (seen.has(f.family)) return [];
              seen.add(f.family);
              if ((f.files || []).length) return f.files;
              return f.url ? [{ name: `${f.family} (Google Fonts)`, src: f.url, external: true }] : [];
            });
          }
          if (kind === "templates")
            return BRAND.templates.filter((t) => t.image).map((t) => ({ name: t.imageName || t.name, src: t.image }));
          if (kind === "threed")
            return [
              ...(T.folder ? [T.folder] : []),
              ...(T.items || []).flatMap((m) => m.views.filter((v) => v.src)),
            ];
          if (kind === "code") return codeFiles();
          return [];
        }
        function downloads() {
          const list = (BRAND.downloads || []).filter(
            (d) =>
              !d.hidden && !(d.kind === "code" && !SCOPE.website) && !(d.kind === "threed" && !shown("threed")),
          );
          let total = 0;
          const cards = list.map((d) => {
            const files = [...(d.attachments || []), ...autoFiles(d.kind)];
            const n = files.filter((f) => !f.external).length || Number(d.files) || 0;
            total += n;
            const row = (f) =>
              `<div class="dl-file"><span title="${esc(f.name)}">${esc(f.label || f.name)}</span>${dlBtn(f, f.external ? "Open" : "Download")}</div>`;
            const list =
              files.length > 5
                ? files.slice(0, 4).map(row).join("") +
                  `<details class="dl-more"><summary>Show all ${files.length}</summary><div class="dl-files">${files.slice(4).map(row).join("")}</div></details>`
                : files.map(row).join("");
            return `<div class="card dl" data-card-list="downloads" data-card-index="${BRAND.downloads.indexOf(d)}"><div class="top"><div><code>${esc(d.folder)}</code><h3 style="margin:4px 0 0">${esc(d.title)}</h3></div>${n ? `<span class="pill num">${n} ${n === 1 ? "file" : "files"}</span>` : ""}</div>
    <p>${esc(d.desc)}</p>${(d.formats || []).length ? `<div class="fmt">${d.formats.map((f) => `<span>${esc(f)}</span>`).join("")}</div>` : ""}
    ${files.length ? `<div class="dl-files">${list}</div>` : d.url ? "" : `<p class="dl-empty">Files coming soon.</p>`}
    ${d.url ? linkBtn(d.url, "Open folder") : ""}</div>`;
          });
          return `<section id="downloads">${head("Assets", "Downloads", `${total} files in ${list.length} folders. Open a shared folder or download individual files below.`)}
  <div class="grid g3">${cards.join("")}</div></section>`;
        }

        function handoff() {
          const start = new Date(C.deliveredOn + "T12:00:00"),
            end = new Date(start);
          end.setDate(end.getDate() + C.supportDays);
          const now = new Date(),
            used = Math.min(1, Math.max(0, (now - start) / (end - start))),
            left = Math.max(0, Math.ceil((end - now) / 864e5));
          const rows = (arr) =>
            arr

      // Fill in anything an older saved client is missing.

      /* ---------- Color engine (same math as the dashboard and the code kit) ---------- */
      const STEPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
      const hex2rgb = (h) => {
        h = String(h).replace("#", "");
        if (h.length === 3) h = [...h].map((c) => c + c).join("");
        return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) || 0);
      };
      const rgb2hex = (a) =>
        "#" +
        a
          .map((v) =>
            Math.round(Math.max(0, Math.min(255, v)))
              .toString(16)
              .padStart(2, "0"),
          )
          .join("")
          .toUpperCase();
      const mix = (a, b, t) => {
        const A = hex2rgb(a),
          B = hex2rgb(b);
        return rgb2hex(A.map((v, i) => v + (B[i] - v) * t));
      };
      function ramp(base) {
        const tint = [0.92, 0.84, 0.68, 0.5, 0.28],
          shade = [0.14, 0.3, 0.45, 0.6, 0.72],
          o = {};
        STEPS.forEach((s, i) => {
          o[s] =
            i < 5
              ? mix(base, "#FFFFFF", tint[i])
              : i === 5
                ? String(base).toUpperCase()
                : mix(base, "#000000", shade[i - 6]);
        });
        return o;
      }
      const lum = (h) =>
        hex2rgb(h)
          .map((v) => {
            v /= 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          })
          .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
      const contrast = (a, b) => {
        const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m);
        return (x + 0.05) / (y + 0.05);
      };
      const validHex = (v) => /^#?[0-9a-f]{6}$/i.test(String(v).trim());
      const normHex = (v) => "#" + String(v).trim().replace("#", "").toUpperCase();

      /* ---------- Capabilities ---------- */
      let db = null,

      /* ---------- Paths ---------- */
      const getPath = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
      function setPath(o, p, v) {
        const ks = p.split(".");
        let a = o;
        ks.slice(0, -1).forEach((k) => {

      /* ---------- Asset URL resolution ---------- */
      const localBlobs = new Map(); // id -> objectURL (view-only mode)
      function assetUrl(ref, absolute = false) {

            ? "/_blob/" + ref.id

        return absolute && !u.startsWith("blob:") ? new URL(u, location.href).href : u;
      }

      /* ======================================================================
   BRAND OBJECT for the dashboard template
   ====================================================================== */
      function googleCssFor(fonts) {
        const fams = ["display", "body", "mono"]
          .map((r) => fonts[r])
          .filter((f) => f.source === "google" && f.family && f.family.trim());
        if (!fams.length) return "";
        const seen = new Map();
        fams.forEach((f) => {
          const k = f.family.trim();
          const w = new Set([...(seen.get(k) || []), ...(f.weights?.length ? f.weights : [400])]);
          seen.set(k, w);

        return (
          "https://fonts.googleapis.com/css2?" +
          [...seen]
            .map(

      function roleWeights(f) {

      const slugVer = (cfg) => [

      const dlShown = (cfg, d) =>
        !d.hidden && !(d.kind === "code" && !cfg.scope.website) && !(d.kind === "threed" && !sectionOn(cfg, "threed"));

      function toBrand(cfg, urlFor) {
        const c = cfg.client,
          F = cfg.fonts;
        const fontOut = (r) => {

          agency: cfg.agency,

          scales: cfg.scales.map((g) => ({

          hiddenSections: SECTION_TOGGLES.map(([k]) => k).filter((k) => !sectionOn(cfg, k)),
          hiddenParts: cfg.hiddenParts,
          scope: cfg.scope,
          hero: { ...cfg.hero, image: urlFor(cfg.hero.image) },
          threeD: {
            folder: cfg.threeD.folder?.zip

                  count: cfg.threeD.folder.count,
                  size: cfg.threeD.folder.size,
                  formats: cfg.threeD.folder.formats || [],
                  src: urlFor(cfg.threeD.folder.zip),
                }
              : null,
            items: cfg.threeD.items.map((m, i) => ({
              name: m.name,
              desc: m.desc,
              views: m.views.map((v) => ({

          figmaFiles: cfg.figmaFiles.map((f) => ({ ...f, name: `${c.name} — ${f.name}` })),

      function dashboardDoc(brand) {

      /* ======================================================================
   PREVIEW (double-buffered so it never flashes white)
   ====================================================================== */
      let frontFrame = $("#fa"),
        backFrame = $("#fb"),
        pendingJump = null;
      function refreshPreview() {
        if (!cur) return;
        if (!tplHTML) {
          showPmsg("Loading the dashboard template…");
          return;
        }
        // Read the scroll position when the new frame is ready, so a jump made while it loads is kept.
        const frontY = () => {
          try {
            return frontFrame.contentWindow.scrollY || 0;
          } catch {
            return 0;
          }
        };
        const html = dashboardDoc(toBrand(cur.config, (r) => assetUrl(r, true)));
        const f = backFrame;
        f.onload = () => {
          // One swap per render. A stale handler firing again (for example when the front frame
          // navigates) used to hide both frames and leave the preview blank.
          f.onload = null;
          if (f === frontFrame) return;
          enhancePreview(f);
          try {
            const w = f.contentWindow;
            if (pendingJump) {
              scrollFrameTo(w, pendingJump);
              pendingJump = null;
            } else w.scrollTo(0, frontY());

          f.removeAttribute("tabindex");

          frontFrame.setAttribute("tabindex", "-1");

      }
      const queuePreview = debounce(refreshPreview, 280);
      function showPmsg(m) {
        const p = $("#pmsg");
        p.textContent = m;
        p.hidden = false;
      }
      // Scroll only the preview document (scrollIntoView would also scroll the builder around it).
      function scrollFrameTo(w, id) {
        if (w.__goto) return w.__goto(id, false);
        const el = w.document.getElementById(id);
        if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 8);
        return !!el;
      }
      function jumpPreview(id) {
        if (!id) return;

            return;
          }
          if (doc.readyState === "complete" && doc.getElementById("main")) return; // hidden section: nothing to show
        } catch {}

      }

      /* ---------- Follow along: the preview shows the dashboard section for the step you're on ---------- */
      let activeStep = null,
        stepObserver = null,
        followLock = 0;
      const followOn = () => $("#follow")?.checked !== false;
      // After a jump, ignore the scroll observer briefly so a short step (like Spacing) isn't
      // immediately replaced by the step below it.
      const lockFollow = () => (followLock = Date.now() + 900);
      function setActiveStep(id, force, noJump) {
        if (id === activeStep && !force) return;
        activeStep = id;
        document
          .querySelectorAll("[data-chip]")
          .forEach((c) => c.classList.toggle("on", c.dataset.chip === id));
        const chip = document.querySelector(`[data-chip="${id}"]`),
          bar = chip?.parentElement;
        if (chip && bar) bar.scrollLeft = chip.offsetLeft - bar.clientWidth / 2 + chip.offsetWidth / 2;
        // Say so when this step's section is switched off, instead of showing an unrelated part.
        const C = cur?.config,
          note = $("#pnote");
        const off = C && id !== "welcome" && id !== "review" && !sectionOn(C, id);
        if (note) {
          note.hidden = !off;
          if (off)
            note.textContent = `${BUILD_STEPS[stepNo(id) - 1][1]} is hidden from the client’s dashboard${id === "components" && !C.scope.website ? " (no website build in step 1)" : ""}.`;
        }
        if (!noJump && (followOn() || force)) jumpPreview(dashId(id));
      }
      // Clicking a link inside the preview moves the builder to the matching step.
      window.addEventListener("message", (e) => {
        const id = e.data && e.data.brandHubNav;
        if (!id || !cur || e.source !== frontFrame.contentWindow) return;
        const s = document.getElementById("s-" + id);
        if (!s) return;
        lockFollow();
        if (!window.matchMedia("(max-width:900px)").matches) s.scrollIntoView({ block: "start" });
        setActiveStep(id, false, true);
      });
      function watchSteps() {
        stepObserver?.disconnect();
        const panel = $("#panel"),
          scrolls =
            panel.scrollHeight > panel.clientHeight + 4 && getComputedStyle(panel).overflowY !== "visible";
        stepObserver = new IntersectionObserver(
          (entries) => {
            if (Date.now() < followLock) return;
            const hit = entries
              .filter((e) => e.isIntersecting)
              .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
            if (hit) setActiveStep(hit.target.dataset.sec);
          },
          { root: scrolls ? panel : null, rootMargin: "-15% 0px -75% 0px" },
        );
        panel.querySelectorAll(".sec").forEach((sec) => stepObserver.observe(sec));

      /* ======================================================================

   ====================================================================== */
      function setStatus(s, text) {
        const el = $("#status");
        el.dataset.s = s;
        el.querySelector("span").textContent = text;
      }
      const saveSoon = debounce(save, 900);
      function changed() {
        dirty = true;
        setStatus("saving", "Unsaved changes");
        markPageStale();
        saveSoon();
        queuePreview();
        queueReview();
      }
      const queueReview = debounce(() => refreshReview(), 400);
      async function save() {
        if (!cur || !dirty) return;
        if (!db) {
          setStatus("error", "Not saved: this browser blocks storage");
          return;
        }
        const rev = Math.random().toString(36).slice(2);
        const body = {
          name: cur.config.client.name || "Untitled",
          updatedAt: new Date().toISOString(),
          rev,
          config: cur.config,
        };
        dirty = false;
        lastRev = rev;
        setStatus("saving", "Saving…");
        try {
          await db.doc("clients/" + cur.id).set(clone(body));
          setStatus("saved", localMode ? "Saved in this browser" : "Saved");
        } catch (e) {
          dirty = true;
          setStatus(
            "error",
            e?.code === "permission_denied" || e?.code === "not_granted"
              ? "Not saved: you need edit access"
              : "Not saved, retrying…",
          );
          if (e?.code !== "permission_denied" && e?.code !== "not_granted")
            setTimeout(() => saveSoon(), 4000);
        }
      }

      /* ======================================================================
   CLIENTS
   ====================================================================== */
      function renderClientSelect() {
        const sel = $("#client-select");
        const list = clients.slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
        sel.innerHTML =
          list
            .map(
              (c) =>
                `<option value="${esc(c.id)}"${cur && c.id === cur.id ? " selected" : ""}>${esc(c.name || "Untitled")}</option>`,
            )
            .join("") || "<option>No clients yet</option>";
        sel.disabled = !list.length;
      }
      async function openClient(id) {
        if (dirty) await saveSoon.flush();
        if (!db) return;
        const snap = await db.doc("clients/" + id).get();
        if (!snap.exists) return;
        const data = snap.data();
        cur = { id, config: normalize(clone(data.config)) };
        lastRev = data.rev;
        dirty = false;
        store.set("bb-client", id);
        renderClientSelect();
        renderPanel();
        refreshPreview();
        setStatus("saved", localMode ? "Saved in this browser" : "Saved");
        updatePageState();
        loadFontSamples();
      }
      async function createClient(config) {
        if (dirty) await saveSoon.flush();
        const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        cur = { id, config };
        if (!clients.find((c) => c.id === id)) clients.push({ id, name: config.client.name });
        dirty = true;
        await save();
        store.set("bb-client", id);
        renderClientSelect();
        renderPanel();
        refreshPreview();
        loadFontSamples();

        if (!cur || !db) return;

          setTimeout(() => {
            deleteArmed = false;
            $("#del-btn").innerHTML = "Delete this client<small>Removes the client and its settings</small>";

          return;

        deleteArmed = false;
        closeMenus();
        const id = cur.id;
        saveSoon.cancel();
        dirty = false;
        if (githubReady() && livePages.has(id)) {
          try { await unpublishClientFromGithub(id); }
          catch (error) { toast("Not removed from GitHub · " + error.message, 7000); return; }
        }
        if (diskAvailable) {
          try { await localRequest('delete', { id }); publishedClients.delete(id); }
          catch (error) { toast(error.message, 5000); return; }
        }
        await db.doc("clients/" + id).delete();
        clients = clients.filter((c) => c.id !== id);
        toast("Client deleted");
        if (clients.length) openClient(clients[0].id);
        else {
          cur = null;
          renderEmpty();
          renderClientSelect();
        }

      function reviewHTML() {
        if (!cur) return "";
        const C = cur.config,
          P = placeholderSet(),
          items = [];
        const add = (level, text, stepId) => items.push({ level, text, stepId });
        const has = (v) => typeof v === "string" && P.has(v.trim());
        // Placeholder text, per step
        const ph = {
          welcome:
            [C.client.name, C.client.fullName, C.client.idea].filter(has).length +
            (C.client.slug === "CLIENT" ? 1 : 0),
          brand: [
            C.client.tagline,
            ...C.pillars.flatMap((p) => [p.title, p.text, p.yes, p.no]),
            ...Object.values(C.boilerplate),
            ...C.scales.flatMap((g) => [
              g.title,
              ...g.rows.flatMap((r) => [r.left, r.right, r.label, r.type === "value" ? r.value : ""]),
            ]),
          ].filter(has).length,
          templates: C.templates.flatMap((t) => [t.headline, t.sub]).filter(has).length,
          handoff: C.contacts.flatMap((c) => [c.name, c.email]).filter(has).length,
        };
        for (const [id, n] of Object.entries(ph))
          if (n) add("warn", `${n} placeholder ${n === 1 ? "text" : "texts"} still to replace`, id);
        // Logos
        const noFull = C.logos.filter((l) => !l.full).map((l) => l.name);
        if (noFull.length === 4)
          add("bad", "No logo files yet. The dashboard is showing placeholder marks.", "logo");
        else if (noFull.length) add("warn", `Missing full-color logo: ${noFull.join(", ")}`, "logo");
        if (C.logos[0].full && !C.logos[0].light)
          add(
            "warn",
            "No white / reversed Primary logo. The dark backgrounds reuse the full-color file.",
            "logo",
          );
        // Fonts
        for (const [r, label] of ROLES) {
          const F = C.fonts[r];
          if (F.source === "upload" && !(F.faces || []).length)
            add("bad", `${label}: set to Upload files, but no font files added`, "type");
          if (F.source === "google" && !(F.family || "").trim())
            add("bad", `${label}: no Google Fonts family entered`, "type");
        }
        // Color contrast
        const br = ramp(validHex(C.colors.brand) ? normHex(C.colors.brand) : "#777777");
        const onB =
          contrast(br[600], "#FFFFFF") >= 4.5
            ? "#FFFFFF"
            : ramp(validHex(C.colors.neutral) ? normHex(C.colors.neutral) : "#777777")[950];
        if (contrast(br[600], onB) < 4.5)
          add(
            "warn",
            "Text on brand-colored buttons is below AA contrast. Try a darker or lighter brand color.",
            "color",
          );
        if (C.proportion.reduce((n, p) => n + (Number(p.pct) || 0), 0) !== 100)
          add("warn", "Color proportion doesn’t add up to 100%", "color");
        // Hero and 3D
        if (C.hero.bg === "image" && !C.hero.image)
          add("warn", "Hero background is set to Image, but no image is added", "welcome");
        if (sectionOn(C, "threed") && !C.threeD.folder && !C.threeD.items.some((m) => m.views.some((v) => v.image)))
          add("warn", "No 3D files yet. Turn the section off in step 1 if this project has none.", "threed");
        // Links and files
        const figmaOn = !C.hiddenParts.includes("handoff.figma");
        const autoKinds = ["logo", "color", "type", "templates", "threed", "code"];
        const empty = {
          templates:
            C.templates.filter((t) => !t.canva).length + (figmaOn ? C.templates.filter((t) => !t.figma).length : 0),
          downloads: C.downloads.filter(
            (d) => dlShown(C, d) && !d.url && !(d.attachments || []).length && !autoKinds.includes(d.kind),
          ).length,
          handoff: (figmaOn ? C.figmaFiles.filter((x) => !x.url).length : 0) + C.guides.filter((x) => !x.url).length,
        };
        for (const [id, n] of Object.entries(empty))
          if (n && sectionOn(C, id))
            add(
              "info",
              `${n} ${n === 1 ? "link" : "links"} still pending (shown to the client as “pending”)`,
              id,
            );
        if (!C.contacts.some((c) => /@/.test(c.email || "")))
          add("bad", "No contact email for the client", "handoff");
        const off = SECTION_TOGGLES.map(([k]) => k).filter((k) => !sectionOn(C, k));
        if (off.length)
          add(
            "info",
            `Hidden from this client: ${off.map((id) => BUILD_STEPS[stepNo(id) - 1][1]).join(", ")}`,
            off[0],

        items.sort((a, b) => stepNo(a.stepId) - stepNo(b.stepId)); // same order as the steps
        const icon = { bad: "×", warn: "!", info: "i" };
        const blockers = items.filter((i) => i.level === "bad").length,

          !blockers && !warns
            ? `<div class="review-ok">✓ Ready to deliver${items.length ? ". Notes below." : "."}</div>`
            : `<div class="review-sum">${blockers ? `<b>${blockers} to fix</b>` : ""}${blockers && warns ? " · " : ""}${warns ? `${warns} to check` : ""}</div>`;

          summary +
          `<ul class="review">${items.map((i) => `<li class="lv-${i.level}"><span class="ic" aria-hidden="true">${icon[i.level]}</span><span>${esc(i.text)}</span><button type="button" class="btn ghost small" data-jump="${i.stepId}">Step ${stepNo(i.stepId)}</button></li>`).join("")}</ul>`
        );
      }

      /* ---------- Font samples inside the builder panel ---------- */
      let sampleLink = null;
      const loadedFaces = new Set();
      function loadFontSamples() {
        if (!cur) return;
        const F = cur.config.fonts;
        const css = googleCssFor(F);
        if (css) {
          if (!sampleLink) {
            sampleLink = document.createElement("link");
            sampleLink.rel = "stylesheet";
            document.head.appendChild(sampleLink);
          }
          if (sampleLink.href !== css) sampleLink.href = css;
        }
        let aliases = "";
        for (const r of ["display", "body", "mono"]) {
          const x = F[r];
          if (x.source === "google") aliases += `@font-face{font-family:"bb-${r}";src:local("${x.family}");}`;
          else
            for (const face of x.faces || []) {
              const url = assetUrl(face.asset);
              const key = r + url + face.weight + face.style;
              if (!url || loadedFaces.has(key)) continue;
              try {
                const ff = new FontFace("bb-" + r, `url("${url}")`, {
                  weight: String(face.weight || 400),
                  style: face.style || "normal",
                });
                ff.load()
                  .then((l) => document.fonts.add(l))
                  .catch(() => {});
                loadedFaces.add(key);
              } catch {}
            }
        }
        // Google families: point the sample at the real family name
        document.querySelectorAll("[data-sample]").forEach((el) => {
          const r = el.dataset.sample,
            x = F[r];
          el.style.fontFamily =
            x.source === "google" ? `"${x.family}", ${x.fallback}` : `"bb-${r}", ${x.fallback}`;
        });
      }

      /* ======================================================================
   INPUT HANDLING

      const STRUCTURAL = /^(fonts\.\w+\.faces\.\d+\.(weight|style))$/;
      document.addEventListener("input", (e) => {
        const el = e.target.closest("[data-path]");

          el.type === "checkbox"
            ? el.checked
            : el.type === "number" || el.type === "range"
              ? el.value === ""

          if (v === "") return;
          v = Math.max(0, Math.min(100, Math.round(v)));
          // keep the slider and its number box in step
          document.querySelectorAll(`[data-path="${path}"]`).forEach((o) => {

        if (path.startsWith("colors.") || /^hero\.color2?$/.test(path)) {

          if (el.type === "text") {
            if (!validHex(v)) return;

          } else v = v.toUpperCase();
          document.querySelectorAll(`[data-path="${path}"]`).forEach((o) => {

          });
          const strip = document.querySelector(`[data-ramp="${k}"]`);
          if (strip) strip.innerHTML = rampStrip(v);
        }
        if (path === "client.slug") {
          v = String(v)
            .toUpperCase()
            .replace(/[^A-Z0-9-]/g, "");
          if (el.value !== v) el.value = v;

        if (path.startsWith("typeScale.")) {
          cur.config.typePreset = "custom";

        document
          .querySelectorAll(`[data-out="${path}"]`)

        setPath(cur.config, path, v);
        if (path === "client.name") {
          const c = clients.find((c) => c.id === cur.id);

      });
      document.addEventListener("change", (e) => {

          cur.config.typeScale = makeScale(k).map((t, i) => ({ ...t, font: fonts[i] || t.font }));
          renderPanel();

        if (e.target.matches('select[data-path^="fonts."]')) loadFontSamples();
        // "Custom color" reveals the background color picker.
        if (e.target.matches('select[data-path^="backgrounds."][data-path$=".bg"]')) renderPanel();
        if (e.target.dataset.act === "row-type" && cur) {

          if (t === "value") {

      });

      document.addEventListener("click", (e) => {
        const jump = e.target.closest("[data-jump]");

        const sw = e.target.closest("[data-color]");

      document.addEventListener("keydown", (e) => {

      function applyColor(k, hex) {
        cur.config.colors[k] = normHex(hex);
        document
          .querySelectorAll(`[data-path="colors.${k}"]`)
          .forEach((o) => (o.value = o.type === "color" ? normHex(hex).toLowerCase() : normHex(hex)));
        const strip = document.querySelector(`[data-ramp="${k}"]`);
        if (strip) strip.innerHTML = rampStrip(hex);

      }

      const NEW_ITEMS = {
        pillars: () => ({
          title: "New pillar",
          text: "What this pillar means in one sentence.",
          yes: "A line that sounds like us.",
          no: "A line that does not.",
        }),
        logos: () => ({ kind: "custom", name: "New logo", use: "", full: null, light: null, dark: null }),
        backgrounds: () => ({
          name: "New background",
          note: "",
          bg: "White",
          variant: "Full color",
          logo: "Primary",
          color: "#FFFFFF",
        }),
        templates: () => ({
          name: "New template",
          archetype: "Statement",
          channel: "Instagram",
          size: "1080 × 1350",
          headline: "",
          sub: "",
          canva: "",
          figma: "",
          image: null,
        }),
        guides: () => ({ name: "New guide", desc: "", url: "" }),
        contacts: () => ({ name: "", role: "", email: "" }),
        changelog: () => ({ v: "v1.1", date: today(), note: "" }),
        "threeD.items": newModel,
      };
      async function handleAct(el, e) {
        const a = el.dataset.act;
        if (a === "new") return requestNewClient();
        if (a === "duplicate") {
          closeMenus();
          const c = clone(cur.config);
          c.client.name += " copy";
          return createClient(c);
        }
        if (a === "delete") return deleteClient();
        if (a === "export-zip") {
          closeMenus();
          return exportZip();
        }
        if (a === "export-html") {
          closeMenus();
          return exportHtml();
        }
        if (a === "backup") {
          closeMenus();
          return exportBackup();
        }
        if (a === "restore") {
          closeMenus();
          return openPicker("restore");
        }
        if (!cur) return;
        const C = cur.config;
        if (a === "add") {
          getPath(C, el.dataset.list).push(NEW_ITEMS[el.dataset.list]());
          renderPanel();
          changed();
          return;
        }
        if (a === "hero-bg") {
          const v = el.dataset.v;
          // Start a custom color or gradient from the brand colors.
          if ((v === "custom" || v === "gradient") && C.hero.bg !== "custom" && C.hero.bg !== "gradient") {
            C.hero.color = validHex(C.colors.brand) ? normHex(C.colors.brand) : C.hero.color;
            if (v === "gradient") C.hero.color2 = validHex(C.colors.accent) ? normHex(C.colors.accent) : C.hero.color2;
          }
          C.hero.bg = v;
          renderPanel();
          changed();
          return;
        }
        if (a === "scope-website") {
          C.scope.website = el.checked;
          renderPanel();
          changed();
          return;
        }
        if (a === "toggle-part") {
          const h = new Set(C.hiddenParts);
          el.checked ? h.delete(el.dataset.id) : h.add(el.dataset.id);
          C.hiddenParts = [...h];
          renderPanel();
          changed();
          return;
        }
        if (a === "toggle-dl") {
          C.downloads[+el.dataset.i].hidden = !el.checked;
          renderPanel();
          changed();
          return;
        }
        if (a === "remove-att") {
          C.downloads[+el.dataset.i].attachments.splice(+el.dataset.j, 1);
          renderPanel();
          changed();
          return;
        }
        if (a === "clear-folder3d") {
          C.threeD.folder = null;
          renderPanel();
          changed();
          return;
        }
        if (a === "remove") {
          getPath(C, el.dataset.list).splice(+el.dataset.i, 1);
          renderPanel();
          changed();
          return;
        }
        if (a === "move") {
          const list = getPath(C, el.dataset.list),
            i = +el.dataset.i,
            j = i + +el.dataset.d;
          if (j < 0 || j >= list.length) return;
          [list[i], list[j]] = [list[j], list[i]];
          renderPanel();
          changed();
          return;
        }
        if (a === "add-row") {
          C.scales[+el.dataset.g].rows.push(newScaleRow(el.dataset.type));
          renderPanel();
          changed();
          return;
        }
        if (a === "toggle-section") {
          const id = el.dataset.id,
            h = new Set(C.hiddenSections);
          el.checked ? h.delete(id) : h.add(id);
          C.hiddenSections = SECTION_TOGGLES.map(([k]) => k).filter((k) => h.has(k));
          renderPanel();
          changed();
          return;
        }
        if (a === "clear") {
          e.stopPropagation();
          clearSlot(el.dataset.k);
          return;
        }
        if (a === "font-source") {
          C.fonts[el.dataset.role].source = el.dataset.v;
          renderPanel();
          loadFontSamples();
          changed();
          return;
        }
        if (a === "font-weight") {
          const F = C.fonts[el.dataset.role],
            w = +el.dataset.w;
          F.weights = F.weights.includes(w)
            ? F.weights.filter((x) => x !== w)
            : [...F.weights, w].sort((x, y) => x - y);
          if (!F.weights.length) F.weights = [400];
          renderPanel();
          loadFontSamples();
          changed();
          return;
        }
        if (a === "remove-face") {
          C.fonts[el.dataset.role].faces.splice(+el.dataset.j, 1);
          renderPanel();
          loadFontSamples();
          changed();
          return;
        }
      }
      function clearSlot(key) {
        const [t, a, b] = key.split(":");
        if (t === "logo") cur.config.logos[+a][b] = null;
        if (t === "tpl") cur.config.templates[+a].image = null;
        if (t === "hero") cur.config.hero.image = null;
        if (t === "view") cur.config.threeD.items[+a].views[+b].image = null;
        renderPanel();
        changed();
      }

      /* ======================================================================
   FILES: pick, drop, auto-sort, upload
   ====================================================================== */
      let pickTarget = null;
      function openPicker(target) {
        if (!assets) {
          toast("Saving files isn’t available in this browser window");
          return;
        }
        pickTarget = target;
        if (target === "folder3d") {
          $("#folder-picker").value = "";
          $("#folder-picker").click();
          return;
        }
        const p = $("#picker");
        p.accept =
          target === "restore"
            ? ".json,application/json"
            : target.startsWith("dl:")
              ? ""
              : target.startsWith("font")
                ? ".woff2,.woff,.otf,.ttf"
                : target === "logos" || target.startsWith("logo")
                  ? ".svg,.png,.webp,.jpg,.jpeg"
                  : "image/*";
        p.value = "";
        p.click();
      }
      $("#picker").addEventListener("change", (e) => {
        const files = [...e.target.files];
        if (files.length) routeFiles(files, pickTarget);
      });
      $("#folder-picker").addEventListener("change", (e) => {
        const list = [...e.target.files].map((file) => ({ file, path: file.webkitRelativePath || file.name }));
        if (list.length) addFolder3d(list);
      });
      // A dropped folder arrives as directory entries; walk them to get every file with its path.
      async function readEntries(entries) {
        const out = [];
        const walk = async (en) => {
          if (en.isFile) {
            const file = await new Promise((res, rej) => en.file(res, rej));
            out.push({ file, path: en.fullPath.replace(/^\//, "") });
          } else if (en.isDirectory) {
            const r = en.createReader();
            for (;;) {
              const batch = await new Promise((res, rej) => r.readEntries(res, rej));
              if (!batch.length) break;
              for (const c of batch) await walk(c);
            }
          }
        };
        for (const en of entries) await walk(en);
        return out;
      }

      let dragDepth = 0;
      const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
      const hasColor = (e) => [...(e.dataTransfer?.types || [])].includes("text/x-color");
      document.addEventListener("dragstart", (e) => {
        const sw = e.target.closest?.("[data-color]");
        if (sw) {
          e.dataTransfer.setData("text/x-color", sw.dataset.color);
          e.dataTransfer.effectAllowed = "copy";
        }
      });
      document.addEventListener("dragenter", (e) => {
        if (!hasFiles(e) && !hasColor(e)) return;
        dragDepth++;
        document.body.classList.add("dragging");
        if (hasFiles(e)) $("#dropbar").hidden = false;
      });
      document.addEventListener("dragleave", (e) => {
        if (!hasFiles(e) && !hasColor(e)) return;
        if (--dragDepth <= 0) endDrag();
      });
      document.addEventListener("dragover", (e) => {
        if (!hasFiles(e) && !hasColor(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        document.querySelectorAll(".is-over").forEach((x) => x.classList.remove("is-over"));
        const z = e.target.closest("[data-drop]");
        if (z && (!hasColor(e) || z.dataset.drop.startsWith("color:"))) z.classList.add("is-over");
      });
      document.addEventListener("drop", (e) => {
        if (!hasFiles(e) && !hasColor(e)) return;
        e.preventDefault();
        endDrag();
        const z = e.target.closest("[data-drop]");
        if (hasColor(e)) {
          if (z && z.dataset.drop.startsWith("color:") && cur)
            applyColor(z.dataset.drop.split(":")[1], e.dataTransfer.getData("text/x-color"));
          return;
        }
        if (z && z.dataset.drop === "folder3d") {
          // Entries must be read now, before the drop event ends.
          const entries = [...(e.dataTransfer.items || [])]
            .map((it) => it.webkitGetAsEntry?.())
            .filter(Boolean);
          if (entries.length) {
            readEntries(entries)
              .then((list) => addFolder3d(list))
              .catch(() => toast("Couldn’t read that folder. Try choosing it with a click instead.", 3500));
            return;
          }
        }
        const files = [...e.dataTransfer.files];
        if (files.length) routeFiles(files, z ? z.dataset.drop : null);
      });
      function endDrag() {
        dragDepth = 0;
        document.body.classList.remove("dragging");
        $("#dropbar").hidden = true;
        document.querySelectorAll(".is-over").forEach((x) => x.classList.remove("is-over"));
      }

      const isFont = (f) => /\.(woff2?|otf|ttf)$/i.test(f.name);
      const isImage = (f) => /^image\//.test(f.type) || /\.(svg|png|jpe?g|webp|gif)$/i.test(f.name);
      function guessLogo(name) {
        const n = name.toLowerCase().replace(/[_\-.]+/g, " ");
        let kind = null;
        if (/wordmark|logotype|word mark/.test(n)) kind = "wordmark";
        else if (/stack|vertical|centered/.test(n)) kind = "stacked";
        else if (/symbol|logomark|\bmark\b|icon|monogram|glyph|favicon|avatar|emblem/.test(n))
          kind = "symbol";
        else if (/primary|horizontal|main|lockup|full logo/.test(n)) kind = "primary";
        let variant = "full";
        if (/white|reverse|reversed|knockout|negative|inverse|\blight\b|on dark/.test(n)) variant = "light";
        else if (/black|\bdark\b|\bmono\b|one colou?r|1 colou?r|single colou?r/.test(n)) variant = "dark";
        return { kind, variant };
      }

      async function routeFiles(files, target) {
        // Download cards and the 3D folder take any file type, including .json.
        if (target && (target.startsWith("dl:") || target === "folder3d")) {
          if (!cur) return toast("Create a client first");
          if (!assets) return toast("Saving files isn’t available in this browser window");
          return target === "folder3d"
            ? addFolder3d(files.map((file) => ({ file, path: file.webkitRelativePath || file.name })))
            : addAttachments(+target.split(":")[1], files);
        }
        const backups = files.filter((f) => /\.json$/i.test(f.name));
        if (backups.length) {
          for (const b of backups) await importBackup(b);
          files = files.filter((f) => !backups.includes(f));
          if (!files.length) return;
        }
        if (!cur) {
          toast("Create a client first");
          return;
        }
        if (!assets) {
          toast("Saving files isn’t available in this browser window");
          return;
        }
        const fonts = files.filter(isFont),
          images = files.filter((f) => !isFont(f) && isImage(f)),
          other = files.length - fonts.length - images.length;
        if (other)
          toast(
            `${other} file${other > 1 ? "s" : ""} skipped. Use SVG/PNG for logos and WOFF2/WOFF/OTF/TTF for fonts.`,
            3500,
          );

        // Fonts
        if (fonts.length) {
          let role = target && target.startsWith("font:") ? target.split(":")[1] : null;
          if (!role) {
            const F = cur.config.fonts;
            role =
              F.display.source !== "upload" || !(F.display.faces || []).length
                ? "display"
                : F.body.source !== "upload" || !(F.body.faces || []).length
                  ? "body"
                  : "display";
          }
          await addFonts(fonts, role);
        }
        // Images
        if (images.length) {
          if (target && target.startsWith("tpl:")) {
            await putAsset(images[0], `tpl:${target.split(":")[1]}`);
          } else if (target === "hero" || (target && target.startsWith("view:"))) {
            await putAsset(images[0], target);
          } else if (target && target.startsWith("logo:")) {
            await putAsset(images[0], target);
            if (images.length > 1) await autoLogos(images.slice(1));
          } else await autoLogos(images);
        }
      }
      async function autoLogos(images) {
        const placed = [];
        for (const file of images) {
          const g = guessLogo(file.name);
          let i = g.kind ? cur.config.logos.findIndex((l) => l.kind === g.kind) : -1;
          if (i < 0) {
            i = cur.config.logos.findIndex((l) => !l[g.variant]);
            if (i < 0) i = 0;
          }
          await putAsset(file, `logo:${i}:${g.variant}`);
          placed.push(`${cur.config.logos[i].name} · ${VARIANTS.find((v) => v[0] === g.variant)[1]}`);
        }
        if (placed.length)
          toast(
            placed.length === 1
              ? `Placed as ${placed[0]}`
              : `Placed ${placed.length} logos: ${placed.join(", ")}`,
            4200,
          );
      }

      async function uploadBlob(file, type) {
        if (!assets) {
          const id = "local-" + Math.random().toString(36).slice(2);
          localBlobs.set(id, URL.createObjectURL(file));
          return { id, url: localBlobs.get(id), name: file.name, type: type || file.type, size: file.size };
        }
        const r = await assets.upload(file, type ? { type } : undefined);
        return { id: r.id, url: r.url, name: file.name, type: r.contentType, size: r.sizeBytes };
      }
      const uploadError = (e) =>
        e?.name === "QuotaExceededError"
          ? "This browser’s storage is full. Back up and delete old clients to make room."
          : "Couldn’t store that file. Try again.";

      async function putAsset(file, key) {
        uploading.add(key);
        renderPanel();
        try {
          if (key.startsWith("logo:")) collectColors(file);
          const ref = await uploadBlob(file);
          const [t, a, b] = key.split(":");
          if (t === "logo") cur.config.logos[+a][b] = ref;
          if (t === "tpl") cur.config.templates[+a].image = ref;
          if (t === "hero") cur.config.hero.image = ref;
          if (t === "view") cur.config.threeD.items[+a].views[+b].image = ref;
          changed();
        } catch (e) {
          toast(uploadError(e), 3500);
        } finally {
          uploading.delete(key);
          renderPanel();
        }
      }

      /* Files the client downloads from a Downloads card (manuals, guidelines, imagery…). */
      async function addAttachments(i, files) {
        const d = cur.config.downloads[i],
          key = "dl:" + i;
        uploading.add(key);
        renderPanel();
        let n = 0;
        for (const file of files) {
          try {
            const ref = await uploadBlob(file);

      /* Reads the family name, weight and italic flag straight from a .ttf/.otf file.
   (.woff and .woff2 files are compressed, so their filename is used instead.) */
      function readSfnt(buf) {
        const v = new DataView(buf);
        const numTables = v.getUint16(4);
        const tables = {};
        for (let i = 0; i < numTables; i++) {
          const o = 12 + i * 16;
          const tag = String.fromCharCode(
            v.getUint8(o),
            v.getUint8(o + 1),
            v.getUint8(o + 2),
            v.getUint8(o + 3),
          );
          tables[tag] = { offset: v.getUint32(o + 8), length: v.getUint32(o + 12) };
        }
        const out = {};
        if (tables["OS/2"]) {
          const o = tables["OS/2"].offset;
          out.weight = v.getUint16(o + 4);
          out.italic = (v.getUint16(o + 62) & 1) === 1;
        }
        if (tables.name) {
          const base = tables.name.offset,
            count = v.getUint16(base + 2),
            strings = base + v.getUint16(base + 4);
          const names = {};
          for (let i = 0; i < count; i++) {
            const r = base + 6 + i * 12;
            const platform = v.getUint16(r),
              nameId = v.getUint16(r + 6),
              len = v.getUint16(r + 8),
              off = v.getUint16(r + 10);
            if (nameId !== 1 && nameId !== 16) continue;
            let text = "";
            if (platform === 3 || platform === 0) {
              for (let j = 0; j < len; j += 2) text += String.fromCharCode(v.getUint16(strings + off + j));
            } else {
              for (let j = 0; j < len; j++) text += String.fromCharCode(v.getUint8(strings + off + j));
            }
            if (text && !names[nameId]) names[nameId] = text;
          }
          out.family = names[16] || names[1];
        }
        return out;
      }

      async function readFontMeta(file) {
        const base = file.name.replace(/\.[^.]+$/, "");
        const W = [
          [/thin|hairline/i, 100],
          [/extra ?light|ultra ?light/i, 200],
          [/light/i, 300],
          [/semi ?bold|demi ?bold/i, 600],
          [/extra ?bold|ultra ?bold|heavy/i, 800],
          [/black/i, 900],
          [/bold/i, 700],
          [/medium/i, 500],
          [/regular|book|normal|roman/i, 400],
        ];
        const spaced = base.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[_\-]+/g, " ");
        let weight = (W.find(([r]) => r.test(spaced)) || [, 400])[1];
        let style = /italic|oblique/i.test(spaced) ? "italic" : "normal";
        let family = spaced
          .split(/\s+/)
          .filter(
            (w) =>
              !/^(thin|hairline|extra|ultra|light|semi|demi|bold|heavy|black|medium|regular|book|normal|roman|italic|oblique|variable|vf|web|webfont|\d+)$/i.test(
                w,
              ),
          )
          .join(" ")
          .trim();
        if (/\.(ttf|otf)$/i.test(file.name)) {
          try {
            const info = readSfnt(await file.arrayBuffer());
            family = info.family || family;
            if (info.weight) weight = Math.round(info.weight / 100) * 100;
            if (info.italic) style = "italic";
          } catch {}
        }
        return { family: family || base, weight: Math.min(900, Math.max(100, weight)), style };
      }

      /* Colors from a dropped logo: sample pixels, keep distinct saturated-ish colors */
      function collectColors(file) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const c = document.createElement("canvas");
            const s = 96;
            c.width = s;
            c.height = s;
            const x = c.getContext("2d", { willReadFrequently: true });
            x.drawImage(img, 0, 0, s, s);
            const d = x.getImageData(0, 0, s, s).data,
              buckets = new Map();
            for (let i = 0; i < d.length; i += 4) {
              if (d[i + 3] < 200) continue;
              const r = d[i],
                g = d[i + 1],
                b = d[i + 2];
              const mx = Math.max(r, g, b),
                mn = Math.min(r, g, b);
              if (mn > 225) continue;
              if (mx < 18) continue;
              const k = [r, g, b].map((v) => Math.round(v / 24) * 24).join(",");
              const e = buckets.get(k) || { n: 0, r: 0, g: 0, b: 0 };
              e.n++;
              e.r += r;
              e.g += g;
              e.b += b;
              buckets.set(k, e);
            }
            const opaque = [...buckets.values()].reduce((t, e) => t + e.n, 0);
            const dist = (a, b) => {
              const A = hex2rgb(a),
                B = hex2rgb(b);
              return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]);
            };
            const found = [...buckets.values()]
              .filter((e) => e.n >= Math.max(8, opaque * 0.03))
              .sort((a, b) => b.n - a.n)
              .slice(0, 5)
              .map((e) => rgb2hex([e.r / e.n, e.g / e.n, e.b / e.n]));
            const all = [...cur.config.colorSuggestions];
            for (const h of found) if (!all.some((o) => dist(o, h) < 48)) all.push(h);
            if (all.length !== cur.config.colorSuggestions.length) {
              cur.config.colorSuggestions = all.slice(-10);
              renderPanel();
              changed();
            }
          } catch {}
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }

      const CRC_TABLE = (() => {
